      if (!u){ toast('O link da versão ' + (i+1) + ' não parece um link de vídeo. Cole o link copiado do YouTube.'); return; }
      const old = (ex.videos || []).find(o => o.url === u);
      out.push(Object.assign({label:(v.label || '').trim(), url:u}, old && old.dur ? {dur:old.dur} : {}));
    }
    ex.videos = out; ex.video = out[0] ? out[0].url : '';
    vidEdit = false; vdraft = null; savePlan(); renderSheet();
    toast(out.length ? out.length + (out.length === 1 ? ' vídeo salvo' : ' vídeos salvos') : 'Vídeos removidos. O botão volta a abrir a busca');
  }
  else if (a === 'timer'){ const ex = findEx(openId); if (timer.iv) stopTimer(); else startTimer(ex); renderSheet(); }
  else if (a === 'edit') openEditor();
  else if (a === 'new') openEditor({name:'Meu plano', days:[blankDay(0)]});
  else if (a === 'example'){ plan = clone(EXAMPLE); savePlan(); render(); }
  else if (a === 'cancel'){ draft = null; view = 'plan'; render(); window.scrollTo(0,0); }
  else if (a === 'saveplan') commitEditor();
  else if (a === 'wd'){ const d = draft.days[di], w = +b.dataset.w; d.weekdays = d.weekdays || []; d.weekdays = d.weekdays.includes(w) ? d.weekdays.filter(x=>x!==w) : d.weekdays.concat(w); b.setAttribute('aria-pressed', d.weekdays.includes(w)); }
  else if (a === 'addex'){ const nx = blankEx(); draft.days[di].exercises.push(nx); edOpen.add(nx.id); edQuery = ''; confirmDel = null; renderEditor(); const f = $('#d' + di + 'e' + (draft.days[di].exercises.length - 1) + '-name'); if (f){ f.focus(); f.scrollIntoView({block:'center'}); } }
  else if (a === 'rmex'){ draft.days[di].exercises.splice(ei,1); renderEditor(); }
  else if (a === 'mv'){ const l = draft.days[di].exercises, j = ei + +b.dataset.dir; [l[ei], l[j]] = [l[j], l[ei]]; renderEditor(); }
  else if (a === 'addday'){ const nd = blankDay(draft.days.length); draft.days.push(nd); edDay = draft.days.length - 1; edOpen = new Set([nd.exercises[0].id]); confirmDel = null; renderEditor(); }
  else if (a === 'rmday'){ if (confirmDel === di){ draft.days.splice(di,1); confirmDel = null; if (edDay !== 'all') edDay = Math.max(0, Math.min(edDay, draft.days.length - 1)); if (!draft.days.length) edDay = 'all'; } else confirmDel = di; renderEditor(); }
});
document.addEventListener('mousedown', ev => { if (ev.target.closest && ev.target.closest('.peek')) ev.preventDefault(); });
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'sh-load'){ const ex = findEx(openId); if (ex){ ex.load = t.value; savePlan(); if ((log.sets[ex.id] || 0) > 0) saveLog(); } return; }
  if (t.id === 'ed-q'){ edQuery = t.value; applyEdFilter(); return; }
  if (t.dataset.pw){ pw[t.dataset.pw] = t.value; return; }
  if (t.dataset.lg){ lg[t.dataset.lg] = t.value; return; }
  if (bdraft && t.dataset.m){ bdraft[t.dataset.m] = t.value; return; }
  if (vdraft && t.dataset.vl != null){ vdraft[+t.dataset.vl].label = t.value; return; }
  if (vdraft && t.dataset.vu != null){ vdraft[+t.dataset.vu].url = t.value; return; }
  if (pdraft && t.dataset.pf){ pdraft[t.dataset.pf] = t.value; if (/^target/.test(t.dataset.pf)){ const m = $('#meta-prev'); if (m) m.textContent = metaPreview(pdraft); } return; }
  if (!draft || t.dataset.f == null) return;
  const d = draft.days[+t.dataset.d];
  const target = t.dataset.e != null ? d.exercises[+t.dataset.e] : d;
  target[t.dataset.f] = t.value;
  if (t.dataset.e == null){ renderSched(); if (t.dataset.f === 'label'){ const c = document.querySelector('.ed-chip[data-v="' + t.dataset.d + '"] b'); if (c) c.textContent = t.value || 'Treino'; } }
  else edRowRefresh(target);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'imp-file'){
    const f = t.files && t.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { let o = null; try { o = JSON.parse(r.result); } catch(e){} applyBackup(o); };
    r.readAsText(f); return;
  }
  if (t.id === 'sh-load') render();
  else if (t.dataset.progex){ progEx = t.value; render(); }
  else if (draft && t.dataset.wk != null){ assign(+t.dataset.wk, t.value); renderSched(); }
  else if (pdraft && t.dataset.pf) pdraft[t.dataset.pf] = t.value;
  else if (bdraft && t.dataset.m) bdraft[t.dataset.m] = t.value;
});
document.addEventListener('submit', ev => { if (ev.target.id === 'login-form'){ ev.preventDefault(); doEmailAuth(); }
  if (ev.target.id === 'pw-form'){ ev.preventDefault(); if (!pw.busy) doChangePassword(); } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#player').hidden){ closePlayer(); return; } if (ev.key === 'Escape' && (openId || openEntry)) closeSheet(); });

init();
</script>

if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
