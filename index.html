<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.cloudReady = new Promise(function (r) { window.__cloudResolve = r; }); setTimeout(function () { window.__cloudResolve && window.__cloudResolve(null); }, 20000);</script>

<title>Treino do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de uma coluna. Cartão "ferro" escuro com a anilha de progresso abre a tela; cada treino veste a cor de uma anilha olímpica (vermelho 25, azul 20, amarelo 15, verde 10, branco 5); navegação fixa embaixo */
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f3f4f7; --fg:#0f1115; --muted:#5e6472; --line:#dcdfe6;
  --accent:#d6301f; --accent-fg:#ffffff; --accent-soft:#fbe4e1;
  --done:#12804a; --done-soft:#dcf1e5; --danger:#c0261a;
  --iron:#15171c; --iron-2:#22252c; --iron-fg:#f4f5f7; --iron-muted:#a0a6b3; --iron-line:#30343c;
  --scrim:rgba(8,10,14,.5); --shadow:0 1px 2px rgba(15,17,21,.06),0 8px 24px -12px rgba(15,17,21,.18);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --nav:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0f; --surface:#15171b; --surface-2:#1c1f24; --fg:#f1f2f5; --muted:#959baa; --line:#272a31;
  --accent:#ff5a45; --accent-fg:#0b0c0f; --accent-soft:#3a1712;
  --done:#3fd089; --done-soft:#0f2a1c; --danger:#ff8a7d;
  --iron:#1b1e23; --iron-2:#262a31; --iron-fg:#f4f5f7; --iron-muted:#a0a6b3; --iron-line:#343841;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b0c0f; --surface:#15171b; --surface-2:#1c1f24; --fg:#f1f2f5; --muted:#959baa; --line:#272a31;
  --accent:#ff5a45; --accent-fg:#0b0c0f; --accent-soft:#3a1712;
  --done:#3fd089; --done-soft:#0f2a1c; --danger:#ff8a7d;
  --iron:#1b1e23; --iron-2:#262a31; --iron-fg:#f4f5f7; --iron-muted:#a0a6b3; --iron-line:#343841;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav) + 36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.wrap.nonav{padding-bottom:24px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:.95;text-transform:uppercase}
h1{font-size:2.9rem}
h2{font-size:1.6rem}
.eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}
.lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:10px}
.head{display:flex;flex-direction:column;gap:8px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.topbar .brand{font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.topbar .brand i{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 5px var(--accent),inset 0 0 0 7px var(--bg);display:block}

/* cartão ferro (hero) */
.hero{background:var(--iron);color:var(--iron-fg);border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.018) 10px 11px);pointer-events:none}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pc,var(--accent))}
.hero > *{position:relative}
.hero-top{display:flex;justify-content:space-between;gap:14px;align-items:center}
.hero .eyebrow{color:var(--iron-muted)}
.hero h1{font-size:3.6rem;line-height:.88;margin-top:6px}
.hero .focus{margin:8px 0 0;color:var(--iron-muted);font-weight:600;font-size:1rem}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap}
.hero-meta span{font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--iron-2);color:var(--iron-fg);font-variant-numeric:tabular-nums}
.hero.complete::after{background:var(--done)}
.plate{flex:none;width:118px;height:118px}
.plate svg{width:100%;height:100%;display:block;overflow:visible}
.plate .ring{transition:stroke-dashoffset .5s cubic-bezier(.3,.7,.2,1)}
@media (max-width:370px){.hero h1{font-size:3rem}.plate{width:96px;height:96px}}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
.wk{border:0;background:none;border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;line-height:1}
.wk small{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk .badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1rem;background:var(--pc);color:var(--pf);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.wk.off .badge{background:none;border:1.5px dashed var(--line);color:var(--muted);box-shadow:none;font-family:var(--body);font-size:.8rem}
.wk span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.wk.today small,.wk.today span{color:var(--accent)}
.wk[aria-pressed="true"]{background:var(--surface-2)}
.wk[aria-pressed="true"] .badge{box-shadow:0 0 0 2px var(--surface-2),0 0 0 4px var(--pc)}
.wk.off[aria-pressed="true"] .badge{box-shadow:none;border-color:var(--muted)}

/* lista de exercícios */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{font-size:1.5rem}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex{display:flex;align-items:stretch;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:background .2s}
.ex-body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:14px 6px 14px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center}
.ex-num{grid-row:span 3;font-family:var(--display);font-weight:900;font-size:2.3rem;line-height:1;color:var(--line);font-variant-numeric:tabular-nums;width:1.4em;text-align:center}
.ex-name{font-weight:800;font-size:1.02rem;line-height:1.2}
.ex-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ex-meta b{color:var(--fg);font-weight:800}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.dots i.on{background:var(--done);box-shadow:none}
.check{flex:none;width:64px;border:0;background:none;display:grid;place-items:center;border-left:1px solid var(--line)}
.check i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.check svg{width:17px;height:17px;opacity:0}
.check:active i{transform:scale(.9)}
.ex.done{background:var(--done-soft);box-shadow:none}
.ex.done .ex-num{color:var(--done);opacity:.5}
.ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--done);text-decoration-thickness:2px}
.ex.done .check{border-left-color:transparent}
.ex.done .check i{background:var(--done);border-color:var(--done)}
.ex.done .check svg{opacity:1;color:var(--surface)}
.go{display:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;line-height:1.15;text-align:left}
.chip .dot{width:22px;height:22px;border-radius:50%;background:var(--pc,var(--accent));color:var(--pf,#fff);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:.8rem;flex:none}
.chip b{font-weight:700;font-size:.88rem;display:block}
.chip small{font-size:.74rem;color:var(--muted);display:block}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:10px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;flex-direction:column;align-items:center;gap:6px}
.foot small{color:var(--muted);font-size:.76rem;text-align:center}

.rest{background:var(--surface);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.empty{background:var(--surface);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.empty p{margin:0}
.note{font-size:.85rem;padding:12px 14px;border-radius:14px;background:var(--accent-soft);margin:0}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
/* calendário de treinos */
.hm-wrap{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch}
.hm-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.hm-days span{font-size:.64rem;font-weight:700;color:var(--muted);display:flex;align-items:center}
.hm-grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;min-width:0}
.hm-col{display:grid;grid-template-rows:repeat(7,auto);gap:3px}
.hm{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.hm.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface));box-shadow:none}
.hm.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface));box-shadow:none}
.hm.l3{background:color-mix(in srgb,var(--accent) 78%,var(--surface));box-shadow:none}
.hm.l4{background:var(--accent);box-shadow:none}
.hm.lx{background:none;box-shadow:inset 0 0 0 1px var(--line);opacity:.35}
.hm.now{outline:2px solid var(--fg);outline-offset:1px}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600;margin-top:4px}
.hm-legend span:first-child{margin-right:4px}.hm-legend span:last-child{margin-left:4px}
.hm-legend .hm{width:12px;height:12px;aspect-ratio:auto;border-radius:3px}
.nav button{border:0;background:none;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:700}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--accent)}

/* folha de detalhes */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:18px;animation:up .26s cubic-bezier(.2,.8,.2,1);border-top:6px solid var(--pc,var(--accent))}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.plate .ring{transition:none}.set.on{animation:none!important}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-top h2{font-size:2.1rem}
.x{border:0;background:var(--surface-2);border-radius:50%;width:38px;height:38px;flex:none;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat small{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat input{width:100%;border:0;background:none;padding:0;font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1;outline-offset:4px}
.stat input::placeholder{color:var(--muted);opacity:.5}
.stat.edit{box-shadow:inset 0 0 0 1.5px var(--line)}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:none;font-family:var(--display);font-weight:900;font-size:1.3rem;font-variant-numeric:tabular-nums}
.set.on{background:var(--done);border-color:var(--done);color:var(--surface);animation:pop .25s}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--iron);color:var(--iron-fg);border-radius:18px;padding:14px 14px 14px 20px}
.clock{font-family:var(--display);font-size:3.2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.timer.running .clock{color:var(--pc,var(--accent))}
.timer.over .clock{color:var(--done)}
.timer .btn{background:var(--iron-2);border-color:var(--iron-line);color:var(--iron-fg)}
.timer .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.notes{margin:0;white-space:pre-wrap;line-height:1.55}
.video{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;background:var(--iron);color:var(--iron-fg);text-decoration:none;position:relative;overflow:hidden}
.video::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:14px solid var(--pc,var(--accent));opacity:.25}
.video .pb{width:52px;height:52px;border-radius:50%;background:var(--pc,var(--accent));color:var(--pf,#fff);display:grid;place-items:center;flex:none}
.video .pb svg{width:22px;height:22px;margin-left:3px}
.video b{display:block;font-size:1.05rem;font-weight:800}
.tpl-list{display:flex;flex-direction:column;gap:10px}
.tpl{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;width:100%}
.tpl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tpl-top b{font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1}
.tpl-desc{color:var(--muted);font-size:.88rem;line-height:1.4}
.tpl-days{display:flex;flex-wrap:wrap;gap:6px}
.tpl-day{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 10px 3px 3px;border-radius:99px;background:var(--surface-2)}
.tpl-day i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--pf);font-family:var(--display);font-weight:900;font-size:.72rem}
.tpl-lvl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tpl-prev{border-radius:16px;background:var(--surface-2);padding:12px 14px;border-left:5px solid var(--pc)}
.tpl-prev-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tpl-prev-h small{display:block;color:var(--muted);font-size:.76rem;font-weight:600}
.tpl-badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--pc);color:var(--pf);font-family:var(--display);font-weight:900;flex:none}
.tpl-prev ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tpl-prev li{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:.9rem}
.tpl-prev li b{font-variant-numeric:tabular-nums;white-space:nowrap}
.install{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--accent-soft)}
.install img{width:48px;height:48px;border-radius:12px;flex:none}
.install-t{flex:1;min-width:0;display:flex;flex-direction:column}
.install-t b{font-weight:800}
.install-t small{color:var(--muted);font-size:.78rem;line-height:1.3}
.install .btn{padding:10px 14px;flex:none}
.install .btn svg{width:16px;height:16px}
.install-x{border:0;background:none;color:var(--muted);width:28px;height:28px;display:grid;place-items:center;flex:none;margin-left:-6px}
@media (max-width:360px){.install img{display:none}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.steps li{display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.st-n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:900;flex:none}
.kbd{display:inline-block;padding:0 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.guide{gap:0}
.guide summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.guide summary::-webkit-details-marker{display:none}
.guide summary > span:first-child{display:flex;flex-direction:column;gap:4px}
.guide summary b{font-family:var(--display);font-weight:800;font-size:1.35rem;text-transform:uppercase;line-height:1}
.guide .chev{font-size:1.6rem;color:var(--muted);transition:transform .2s}
.guide[open] .chev{transform:rotate(90deg)}
.g-body{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.g-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.g-list li{position:relative;padding-left:22px;line-height:1.45}
.g-list li::before{content:"";position:absolute;left:2px;top:.45em;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.motto{margin:0;padding:14px 16px;border-radius:14px;background:var(--iron);color:var(--iron-fg);font-family:var(--display);font-weight:800;font-size:1.2rem;text-transform:uppercase;line-height:1.1}
.vids{display:flex;flex-direction:column;gap:8px}
.vid-alt{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface-2);color:var(--fg);text-decoration:none}
.vid-alt .pb{width:34px;height:34px;border-radius:50%;background:var(--pc,var(--accent));color:var(--pf,#fff);display:grid;place-items:center;flex:none}
.vid-alt .pb svg{width:14px;height:14px;margin-left:2px}
.vid-alt b{display:block;font-weight:800;font-size:.95rem}
.vid-alt small{color:var(--muted);font-weight:600;font-size:.78rem}
.vid-ed{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.vid-ed input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.vid-save{display:flex;flex-direction:column;gap:8px;margin-top:-6px;padding:14px;border-radius:16px;background:var(--surface-2)}
.vid-save p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.45}
.vid-row{display:flex;gap:8px}
.vid-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.vid-row input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.vid-row .btn{padding:10px 16px}
.video small{color:var(--iron-muted);font-weight:600}

/* semana no editor */
.sched{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.sched h2{font-size:1.5rem;margin-bottom:4px}
.wk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:7px;border-top:1px solid var(--line)}
.wk-row:first-of-type{border-top:0}
.wk-row label{font-weight:700;text-transform:capitalize}
.wk-row select{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 11px;min-width:0;max-width:62%}
.wk-row.rest select{color:var(--muted)}

/* meu corpo */
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card h2{font-size:1.5rem}
.prof{display:flex;flex-wrap:wrap;gap:8px}
.prof div{display:flex;flex-direction:column;background:var(--surface-2);border-radius:12px;padding:8px 12px}
.prof small{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prof b{font-weight:800}
.big{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--display);font-weight:900;font-size:5rem;line-height:.82;font-variant-numeric:tabular-nums}
.big span{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--iron-muted);padding-bottom:4px}
.delta{font-size:.85rem;font-weight:700;color:var(--iron-muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.tile small{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile b{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.tile b span{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--muted);margin-left:4px}
.tile em{font-style:normal;font-size:.74rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{align-self:flex-start;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg)}
.hero .pill{background:var(--iron-2);color:var(--iron-fg)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.8rem;padding:6px 10px;border-radius:10px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;font-variant-numeric:tabular-nums}
.chart .tip b{display:block;font-size:.95rem}
.card .chip{box-shadow:none;background:var(--surface-2);padding:8px 12px;border-radius:12px}
.card .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li+li{border-top:1px solid var(--line)}
.hist button{width:100%;border:0;background:none;text-align:left;padding:12px 2px;display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.hist .d{font-weight:800}
.hist .v{color:var(--muted);font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .go2{color:var(--muted);font-size:1.3rem}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;min-width:0}
.kv small{font-size:.72rem;color:var(--muted);font-weight:600}
.kv b{font-variant-numeric:tabular-nums;font-weight:800}
.kv em{font-style:normal;font-size:.72rem;color:var(--muted)}

/* formulários */
.ed-day{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);border-left:6px solid var(--pc,var(--accent))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:500px){.fgrid{grid-template-columns:repeat(3,1fr)}}
.unit{position:relative}
.unit input{padding-right:46px}
.unit i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.76rem;font-weight:700;color:var(--muted);pointer-events:none}
.ed-ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ed-ex-head{display:flex;align-items:center;gap:6px}
.ed-ex-head .num{font-family:var(--display);font-weight:900;font-size:1.5rem;color:var(--muted);width:24px;flex:none}
.ed-ex-head .field{flex:1}
.mini{border:1px solid var(--line);background:none;border-radius:10px;width:36px;height:36px;flex:none;display:grid;place-items:center;align-self:flex-end}
.mini:disabled{opacity:.3}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:400px){.grid4{grid-template-columns:repeat(2,1fr)}}
.savebar{position:sticky;bottom:0;z-index:5;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--line)}
.savebar .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:.9rem;font-weight:700;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.tb-right{display:flex;align-items:center;gap:10px}
.acct{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);padding:0}
.acct svg{width:18px;height:18px}
/* ===== Tema futurista =====
   Fundo espacial com grade e brilhos, painéis de vidro, neon ciano → violeta → rosa,
   fonte técnica nos títulos. Visual escuro fixo (escolha de design). */
:root:root:root{
  --bg:#05060d; --surface:rgba(18,22,44,.62); --surface-2:rgba(255,255,255,.055); --fg:#e9edff; --muted:#8e97bd;
  --line:rgba(130,150,255,.16);
  --accent:#22d3ee; --accent-fg:#02121a; --accent-soft:rgba(34,211,238,.14);
  --violet:#8b5cf6; --pink:#ec4899;
  --grad:linear-gradient(120deg,#22d3ee 0%,#8b5cf6 55%,#ec4899 100%);
  --done:#34f5a4; --done-soft:rgba(52,245,164,.10); --danger:#ff5c8a;
  --iron:rgba(10,12,30,.72); --iron-2:rgba(255,255,255,.06); --iron-fg:#eef1ff; --iron-muted:#9aa3c7; --iron-line:rgba(130,150,255,.2);
  --scrim:rgba(2,3,10,.72);
  --shadow:0 0 0 1px rgba(130,150,255,.10),0 24px 60px -28px rgba(0,0,0,.9);
  --glow:0 0 22px rgba(34,211,238,.35);
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --r:20px;
  color-scheme:dark;
}
body{
  background:
    radial-gradient(900px 520px at 8% -8%, rgba(139,92,246,.30), transparent 62%),
    radial-gradient(760px 480px at 105% 6%, rgba(34,211,238,.20), transparent 60%),
    radial-gradient(700px 600px at 50% 120%, rgba(236,72,153,.16), transparent 60%),
    #05060d;
  background-attachment:fixed;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(rgba(120,140,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,255,.07) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 75%); mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 75%);
}
.wrap{position:relative;z-index:1}
h1,h2,h3{font-weight:700;letter-spacing:.02em}
.eyebrow{color:#7fe6f7;letter-spacing:.2em}
.eyebrow::before{content:"// ";opacity:.55}
.lbl{color:#9fb0e8;letter-spacing:.16em}

/* vidro */
.hero,.card,.ex,.week,.chip,.tile,.empty,.rest,.sched,.ed-day,.tpl,.install,.lg-card,.nav,.sheet,.toast,.timer,.video,.vid-alt,.stat,.kv div,.prof div,.tpl-prev{
  -webkit-backdrop-filter:blur(18px) saturate(140%); backdrop-filter:blur(18px) saturate(140%);
}
.card,.ex,.week,.chip,.tile,.empty,.rest,.sched,.ed-day,.tpl,.install{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}

/* topo */
.topbar .brand{font-family:var(--display);letter-spacing:.14em}
.topbar .brand i{background:var(--grad);box-shadow:inset 0 0 0 5px transparent,0 0 14px rgba(34,211,238,.7);border-radius:50%;position:relative}
.topbar .brand i::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.acct{background:var(--surface);border-color:var(--line);box-shadow:var(--glow)}

/* cartão principal */
.hero{background:linear-gradient(160deg,rgba(32,38,78,.82),rgba(8,10,26,.86));border:1px solid rgba(34,211,238,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 70px -34px rgba(34,211,238,.45),0 0 0 1px rgba(139,92,246,.12)}
.hero::before{background:
  repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 3px 4px),
  radial-gradient(400px 200px at 100% 0%,color-mix(in srgb,var(--pc,#22d3ee) 30%,transparent),transparent 70%)}
.hero::after{width:3px;background:var(--pc,var(--accent));box-shadow:0 0 18px var(--pc,var(--accent)),0 0 4px var(--pc,var(--accent))}
.hero h1{background:linear-gradient(180deg,#ffffff 30%,#a9c6ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.hero-meta span{background:rgba(255,255,255,.06);border:1px solid var(--iron-line);font-family:var(--display);letter-spacing:.04em}
.plate svg{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--pc) 70%,transparent))}
.big b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* semana */
.wk .badge{box-shadow:0 0 12px color-mix(in srgb,var(--pc) 60%,transparent);font-family:var(--display)}
.wk.off .badge{border-color:var(--line)}
.wk[aria-pressed="true"]{background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line)}
.wk.today small,.wk.today span{color:#7fe6f7}

/* exercícios */
.ex{transition:transform .15s,box-shadow .2s,background .2s}
.ex:active{transform:scale(.99)}
.ex-num{color:transparent;-webkit-text-stroke:1px rgba(130,150,255,.45);font-family:var(--display)}
.check{border-left-color:var(--line)}
.check i{border-color:rgba(130,150,255,.35)}
.ex.done{background:linear-gradient(90deg,rgba(52,245,164,.12),rgba(52,245,164,.04));border-color:rgba(52,245,164,.35)}
.ex.done .ex-num{-webkit-text-stroke:1px var(--done);opacity:.7}
.ex.done .check i{box-shadow:0 0 14px rgba(52,245,164,.6)}
.dots i{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line)}
.dots i.on{background:var(--done);box-shadow:0 0 8px rgba(52,245,164,.7)}

/* botões */
.btn{background:var(--surface);border-color:var(--line);font-family:var(--display);letter-spacing:.04em}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 26px -8px rgba(139,92,246,.7),0 0 0 1px rgba(255,255,255,.08) inset;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.primary:disabled{opacity:.6}
.btn.dark{background:#e9edff;color:#05060d}
.btn.ghost{color:#7fe6f7;background:none}
.chip[aria-pressed="true"],.card .chip[aria-pressed="true"]{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.pill{background:rgba(34,211,238,.12);color:#9befff;border:1px solid rgba(34,211,238,.3)}
.note{background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.3)}

/* navegação */
.nav{background:rgba(6,8,20,.72);border-top:1px solid var(--line)}
.nav button[aria-current="page"]{color:#fff}
.nav button[aria-current="page"] svg{color:#22d3ee;filter:drop-shadow(0 0 6px rgba(34,211,238,.9))}
.nav button{font-family:var(--display);letter-spacing:.06em}

/* folha do exercício */
.sheet{background:linear-gradient(180deg,rgba(20,24,52,.96),rgba(6,8,22,.98));border-top:2px solid var(--pc,var(--accent));box-shadow:0 -20px 60px -20px color-mix(in srgb,var(--pc,#22d3ee) 45%,transparent)}
.x{background:rgba(255,255,255,.07);color:var(--fg)}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.stat b,.stat input{font-family:var(--display)}
.set{border-color:rgba(130,150,255,.35);font-family:var(--display)}
.set.on{box-shadow:0 0 16px rgba(52,245,164,.6);color:#04140c}
.timer{background:rgba(5,7,18,.8);border:1px solid var(--line)}
.clock{font-family:var(--display)}
.timer.running .clock{color:#22d3ee;text-shadow:0 0 18px rgba(34,211,238,.7)}
.video{background:linear-gradient(120deg,rgba(34,211,238,.14),rgba(139,92,246,.18));border:1px solid rgba(34,211,238,.28)}
.video::after{border-color:var(--pc,var(--accent));opacity:.35;filter:blur(1px)}
.video .pb,.vid-alt .pb{box-shadow:0 0 16px color-mix(in srgb,var(--pc,#22d3ee) 70%,transparent)}
.vid-alt,.vid-save{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.field input,.field textarea,.field select,.wk-row select,.vid-ed input,.vid-row input{background:rgba(5,7,18,.6);border-color:var(--line);color:var(--fg)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.savebar{background:rgba(5,6,13,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.toast{background:rgba(233,237,255,.95);color:#05060d;box-shadow:var(--glow)}
.motto{background:var(--grad);color:#fff}
.tile b{font-family:var(--display)}
.install{border-color:rgba(34,211,238,.3)}
.hm.l4{box-shadow:0 0 8px rgba(34,211,238,.7)}

/* ===== tela de login ===== */
.lg{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:18px;padding-block:20px}
.lg-brand{display:flex;align-items:center;gap:16px}
.lg-brand img{border-radius:22px;box-shadow:0 0 40px rgba(34,211,238,.45),0 0 0 1px rgba(255,255,255,.1);animation:pulse 4s ease-in-out infinite}
.lg-brand h1{font-size:2.6rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:.95}
@keyframes pulse{0%,100%{box-shadow:0 0 30px rgba(34,211,238,.35),0 0 0 1px rgba(255,255,255,.1)}50%{box-shadow:0 0 50px rgba(139,92,246,.55),0 0 0 1px rgba(255,255,255,.15)}}
@media (prefers-reduced-motion:reduce){.lg-brand img{animation:none}}
.lg-card{position:relative;padding:22px;border-radius:24px;background:linear-gradient(160deg,rgba(28,34,72,.78),rgba(8,10,26,.86));border:1px solid rgba(34,211,238,.22);
  box-shadow:0 30px 80px -30px rgba(139,92,246,.55),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:16px;overflow:hidden}
.lg-card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--grad);box-shadow:0 0 16px rgba(34,211,238,.8)}
.lg-card h2{font-size:1.6rem}
.lg-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(5,7,18,.6);border:1px solid var(--line)}
.lg-tabs button{border:0;background:none;color:var(--muted);padding:10px;border-radius:10px;font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.lg-tabs button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 0 18px rgba(139,92,246,.5)}
.lg-form{display:flex;flex-direction:column;gap:12px}
.lg-field{display:flex;flex-direction:column;gap:6px}
.lg-field span{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9fb0e8}
.lg-field input{width:100%;border:1px solid var(--line);background:rgba(5,7,18,.65);color:var(--fg);border-radius:12px;padding:13px 14px;font-size:1rem;transition:border-color .15s,box-shadow .15s}
.lg-field input:focus{outline:none;border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.18),0 0 18px rgba(34,211,238,.25)}
.lg-field input::placeholder{color:#5d6690}
.lg-msg{margin:0;padding:10px 12px;border-radius:12px;font-size:.88rem;line-height:1.4}
.lg-msg.err{background:rgba(255,92,138,.12);border:1px solid rgba(255,92,138,.4);color:#ffc2d3}
.lg-msg.ok{background:rgba(52,245,164,.1);border:1px solid rgba(52,245,164,.4);color:#b9ffe0}
.lg-or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}
.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:var(--line)}
.lg-google{background:#fff;color:#1f2330;border:0}
.lg-google svg{color:#1f2330}
.lg-foot{margin:0;text-align:center;color:var(--muted);font-size:.8rem}
/* player de vídeo */
.player{position:fixed;inset:0;z-index:60;background:rgba(2,3,10,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pl-box{width:100%;max-width:820px;display:flex;flex-direction:column;gap:12px}
.pl-box.vert{max-width:min(420px,calc((100vh - 170px) * 9 / 16))}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pl-title{display:flex;flex-direction:column;gap:4px;min-width:0}
.pl-title b{font-family:var(--display);font-size:1.15rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;
  border:1px solid rgba(34,211,238,.35);box-shadow:0 0 0 1px rgba(139,92,246,.2),0 0 40px rgba(34,211,238,.25),0 30px 80px -20px rgba(0,0,0,.9)}

/* ---------- armazenamento ---------- */
const local = {
  get(k){ try{ return JSON.parse(localStorage.getItem('treino:'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('treino:'+k, JSON.stringify(v)); }catch(e){} }
};
const timers = {}, queues = {};
/* o que foi salvo e ainda não chegou na conta fica numa lista; é enviado assim que conectar */
function markPending(path){ const p = local.get('pending') || []; if (!p.includes(path)){ p.push(path); local.set('pending', p); } }
function clearPending(path){ local.set('pending', (local.get('pending') || []).filter(x => x !== path)); }
function localValue(path){
  if (path === 'plan/current' || path === 'profile/me') return local.get(path);
  const [c, id] = path.split('/');
  if (c === 'logs') return trainLog[id];
  if (c === 'water') return waterLog[id];
  if (c === 'measures'){ const m = measures.find(x => x.id === id); if (!m) return undefined; const b = clone(m); delete b.id; return b; }
}
function pushPath(path){
  const v = localValue(path), c = path.split('/')[0];
  if (v == null && c !== 'measures'){ clearPending(path); return; }
  const w = v == null ? db.doc(path).delete() : db.doc(path).set(clone(v));
  w.then(() => clearPending(path)).catch(() => {});
}
function flushPending(){ (local.get('pending') || []).forEach(pushPath); }
function save(path, data){
  local.set(path, data);
  markPending(path);
  if (mode !== 'db') return;
  clearTimeout(timers[path]);
  timers[path] = setTimeout(() => {
    const body = clone(data);
    queues[path] = (queues[path] || Promise.resolve())
      .then(() => db.doc(path).set(body))
      .then(() => clearPending(path))
      .catch(e => toast(e && e.code === 'quota_exceeded' ? 'Espaço cheio: não deu para salvar.' : 'Não deu para salvar agora. Confira sua conexão.'));
  }, 350);
}
const savePlan = () => save('plan/current', plan);
function saveLog(){
  // guarda, para cada exercício feito hoje, as séries, a carga e as repetições do dia (base dos gráficos de progresso)
  const ex = {}, labels = new Set();
  for (const [id, n] of Object.entries(log.sets || {})){
    if (!(n > 0)) continue;
    const e = findEx(id);
    if (!e){ if (log.ex && log.ex[id]) ex[id] = log.ex[id]; continue; }
    ex[id] = {n, kg: parseKg(e.load), reps: repsNum(e.reps), name: e.name};
    const d = dayOfEx(id); if (d) labels.add(d.label);
  }
  log.ex = ex; log.label = [...labels].join(' + ');
  trainLog[logKey] = log; local.set('history', trainLog);
  save('logs/'+logKey, log);
}

async function init(){
  plan = local.get('plan/current');
  log = local.get('logs/'+logKey) || {sets:{}};
  profile = local.get('profile/me');
  measures = local.get('measures') || []; sortM();
  trainLog = local.get('history') || {};
  if (log && setsOf(log) > 0) trainLog[logKey] = log; else if (trainLog[logKey]) log = trainLog[logKey];
  if (!log.sets) log.sets = {};
  waterLog = local.get('water') || {};
  if (location.hash === '#corpo') view = 'body';
  if (location.hash === '#treino') view = 'today';
  if (location.hash === '#saude') view = 'health';
  if (location.hash === '#plano'){ view = 'plan'; fGoal = null; setTimeout(loadTemplates); }
  if (plan) loaded = true;
  render();
  let d = null;
  let cloud = null;
  try { cloud = await window.cloudReady; } catch(e){ cloud = null; }
  cloudRef = cloud;
  if (cloud && cloud.configured){
    const user = await cloud.user();
    if (!user){ view = 'login'; render(); return; }
    account = {name:user.displayName || (user.email || '').split('@')[0], email:user.email || ''};
    d = cloud.db;
  } else noCloud = true;
  if (!d){ mode = 'local'; loaded = true; render(); return; }
  db = d; mode = 'db';
  flushPending();
  // uma vez por aparelho: manda para a conta o que só existe aqui (salvo por versões antigas do app)
  const backfill = !local.get('backfilled');
  const fill = (coll, have, items) => { if (!backfill) return; for (const [id, v] of items) if (!have.has(id) && v) pushPath(coll + '/' + id); };
  const t = setTimeout(() => { slow = true; loaded = true; render(); }, 10000);
  db.doc('plan/current').onSnapshot(s => {
    if (!s.metadata.fromCache){ clearTimeout(t); slow = false; }
    if (s.exists){ plan = clone(s.data()); local.set('plan/current', plan); }
    else if (!s.metadata.fromCache && plan) pushPath('plan/current');   // a conta não tem plano, mas o aparelho tem: envia
    if (!s.metadata.fromCache || s.exists || plan) loaded = true;       // não mostra "sem plano" antes de a conta responder
    if (['today','prog','health','plan'].includes(view)) render();
  }, () => { clearTimeout(t); loaded = true; render(); toast('Não deu para ler sua conta agora. O que você salvar será enviado depois.'); });
  db.doc('profile/me').onSnapshot(s => {
    if (s.exists && !s.metadata.hasPendingWrites){ profile = clone(s.data()); local.set('profile/me', profile); if (view === 'body' || view === 'health' || view === 'prog') render(); }
    else if (!s.exists && !s.metadata.fromCache && profile) pushPath('profile/me');
  }, () => {});
  db.collection('measures').onSnapshot(s => {
    if (s.metadata.hasPendingWrites) return;
    if (s.metadata.fromCache && s.empty) return;
    const mine = measures, got = s.docs.map(d => Object.assign(clone(d.data()), {id:d.id})), ids = new Set(got.map(m => m.id));
    const pend = new Set(local.get('pending') || []);
    if (!s.metadata.fromCache) fill('measures', ids, mine.map(m => [m.id, m]));
    measures = got.filter(m => !(pend.has('measures/' + m.id) && !mine.some(x => x.id === m.id)))
      .concat(mine.filter(m => !ids.has(m.id) && (backfill || pend.has('measures/' + m.id))));
    sortM(); local.set('measures', measures);
    if (view === 'body' || view === 'health' || view === 'prog') render();
  }, () => {});
  db.collection('water').onSnapshot(s => {
    if (s.metadata.hasPendingWrites) return;
    if (s.metadata.fromCache && s.empty) return;
    const h = {}; s.docs.forEach(d => { h[d.id] = clone(d.data()); });
    const pend = new Set(local.get('pending') || []);
    if (!s.metadata.fromCache) fill('water', new Set(Object.keys(h)), Object.entries(waterLog));
    for (const [k, v] of Object.entries(waterLog)) if (!(k in h) && v && (backfill || pend.has('water/' + k))) h[k] = v;
    waterLog = h; local.set('water', waterLog);
    if (view === 'health' || view === 'prog') render();
  }, () => {});
  db.collection('logs').onSnapshot(s => {
    if (s.metadata.hasPendingWrites) return;
    if (s.metadata.fromCache && s.empty) return;
    const h = {}; s.docs.forEach(d => { h[d.id] = clone(d.data()); });
    const pend = new Set(local.get('pending') || []);
    if (!s.metadata.fromCache){ fill('logs', new Set(Object.keys(h)), Object.entries(trainLog)); local.set('backfilled', true); }
    for (const [k, v] of Object.entries(trainLog)) if (!(k in h) && v && (backfill || pend.has('logs/' + k))) h[k] = v;
    trainLog = h; local.set('history', trainLog);
    if (trainLog[logKey]){ log = trainLog[logKey]; if (!log.sets) log.sets = {}; }
    if (view === 'today' || view === 'prog') render();
  }, () => {});
}

function dayFor(w, p){ p = p || plan; return p && p.days.find(d => (d.weekdays||[]).includes(w)); }

function currentDay(){
  if (!plan) return null;
  return plan.days.find(d => d.id === viewDayId) || dayFor(viewWd) || null;
}
function dateOf(w){ // data deste dia na semana atual (segunda a domingo)
  const off = ((w + 6) % 7) - ((today.getDay() + 6) % 7);
  const d = new Date(today); d.setDate(today.getDate() + off); return d;
}
function findEx(id){ for (const d of (plan?.days||[])) for (const e of d.exercises) if (e.id === id) return e; return null; }
function setsDone(ex){ return Math.min(log.sets[ex.id] || 0, ex.sets || 0); }
function isDone(ex){ return ex.sets > 0 && setsDone(ex) >= ex.sets; }
function fmtRest(s){ s = +s||0; return s >= 60 && s % 60 === 0 ? (s/60)+' min' : s+' s'; }
function meta(ex){
  const p = [(ex.sets||0)+' × '+(ex.reps||'—')];
  if (ex.rest) p.push(fmtRest(ex.rest));
  if (ex.load) p.push(ex.load);
  return p.join(' · ');
}

function cleanVideo(s){
  s = String(s || '').trim(); if (!s) return '';
  const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{6,20})/i);
  if (m){ const t = s.match(/[?&]t=(\d+)/); return 'https://www.youtube.com/watch?v=' + m[1] + (t ? '&t=' + t[1] + 's' : ''); }
  const ig = s.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/i);
  if (ig) return 'https://www.instagram.com/' + (ig[1].toLowerCase() === 'p' ? 'p' : 'reel') + '/' + ig[2] + '/';
  const tt = s.match(/^(?:https?:\/\/)?((?:www\.|vm\.|vt\.|m\.)?tiktok\.com\/[^?#\s]+)/i);
  if (tt) return 'https://' + tt[1];
  if (/^https:\/\//i.test(s)) return s;
  if (/^(www\.|m\.)/i.test(s)) return 'https://' + s;
  return null;
}
function videoUrl(ex){
  if (ex.video && /^https:\/\//i.test(ex.video)) return ex.video;

}

/* ---------- player de vídeo dentro do app ---------- */
function embedOf(url){
  url = String(url || '');
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{6,20})/i);
  if (m){
    const t = url.match(/[?&]t=(\d+)/);
    return {src:'https://www.youtube-nocookie.com/embed/' + m[1] + '?autoplay=1&playsinline=1&rel=0&modestbranding=1' + (t ? '&start=' + t[1] : ''), kind:'YouTube', id:m[1]};
  }
  m = url.match(/instagram\.com\/(?:[\w.]+\/)?(reels?|p|tv)\/([\w-]+)/i);
  if (m) return {src:'https://www.instagram.com/' + (m[1].toLowerCase() === 'p' ? 'p' : 'reel') + '/' + m[2] + '/embed/', kind:'Instagram', vertical:true};
  m = url.match(/tiktok\.com\/@[\w.-]+\/video\/(\d+)/i);
  if (m) return {src:'https://www.tiktok.com/embed/v2/' + m[1], kind:'TikTok', vertical:true};
  return null;
}
function isMuted(){ try { return localStorage.getItem('treino:mute') === '1'; } catch(e){ return false; } }
function setMuted(v){ try { localStorage.setItem('treino:mute', v ? '1' : '0'); } catch(e){} }
function muteBtn(){
  const m = isMuted();
  return `<button class="pl-mute${m ? ' off' : ''}" data-act="mute" aria-pressed="${m}" aria-label="${m ? 'Ligar o som dos vídeos' : 'Desligar o som dos vídeos'}">${m ? icon.muted : icon.sound}<span>${m ? 'Sem som' : 'Com som'}</span></button>`;
}
function toggleMute(){
  const m = !isMuted(); setMuted(m);
  const f = document.querySelector('#player iframe');
  if (f && f.contentWindow){
    try {
      f.contentWindow.postMessage(JSON.stringify({event:'command', func: m ? 'mute' : 'unMute', args:[]}), '*');
      if (!m) f.contentWindow.postMessage(JSON.stringify({event:'command', func:'setVolume', args:[100]}), '*');
    } catch(e){}
  }
  const b = document.querySelector('#player .pl-mute'); if (b) b.outerHTML = muteBtn();
  if (!$('#sheet').hidden && $('#sheet').querySelector('[data-act=mute-set]')) renderAccount();
  toast(m ? 'Som desligado em todos os vídeos' : 'Som ligado nos vídeos');
}
function openPlayer(url, label){
  const e = embedOf(url);
  if (!e) return false;
  const vertical = e.vertical || /shorts\//i.test(url) || /skeletmotion/i.test(label || '');
  const src = e.kind === 'YouTube' ? e.src + '&enablejsapi=1&mute=' + (isMuted() ? 1 : 0) + '&origin=' + encodeURIComponent(location.origin) : e.src;
  const el = $('#player');
  el.innerHTML = `<div class="pl-box${vertical ? ' vert' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label || 'Vídeo')}">
    <div class="pl-top"><span class="pl-title"><span class="eyebrow">Vídeo · ${esc(e.kind)}</span><b>${esc(label || '')}</b></span>
      <span class="pl-actions">${e.kind === 'YouTube' ? muteBtn() : ''}<button class="x" data-act="closeplayer" aria-label="Fechar vídeo">${icon.x}</button></span></div>
    <div class="pl-frame"><iframe src="${esc(src)}" title="${esc(label || 'Vídeo do exercício')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    ${e.kind !== 'YouTube' ? '<p class="pl-note">O som deste vídeo é controlado no próprio player.</p>' : ''}
    <a class="btn ghost pl-ext" href="${esc(url)}" target="_blank" rel="noopener">Não carregou? Abrir no ${esc(e.kind)} ↗</a>
  </div>`;

}
function closePlayer(fromBack){
  const el = $('#player'); if (el.hidden) return;

  if (!fromBack){ try { if (history.state && history.state.player) history.back(); } catch(err){} }
}

const PLATES = [['#22d3ee','#02121a'],['#a78bfa','#0b0620'],['#f472b6','#1a0410'],['#34f5a4','#03140c'],['#fbbf24','#1a1002'],['#60a5fa','#020c1a'],['#fb7185','#1a0408']];
function pcOf(d, p){ p = p || plan; const i = p && d ? p.days.indexOf(d) : 0; const c = PLATES[(i < 0 ? 0 : i) % PLATES.length]; return `--pc:${c[0]};--pf:${c[1]}`; }
function badgeOf(d){ if (d.badge) return String(d.badge).slice(0,2).toUpperCase(); const l = (d.label || '').trim(), parts = l.split(/\s+/), last = parts[parts.length-1] || ''; return (parts.length > 1 && last.length <= 2 ? last : l.slice(0,1)).toUpperCase(); }
function dayOfEx(id){ return (plan?.days || []).find(d => d.exercises.some(e => e.id === id)); }
function estMin(day){ let s = 0; day.exercises.forEach(e => { const n = +e.sets || 0; s += n*45 + Math.max(0, n-1)*(+e.rest || 0); }); s += Math.max(0, day.exercises.length - 1)*90; return Math.max(1, Math.round(s/60)); }
function plateSVG(done, n){

    ${f > 0 ? `<circle class="ring" cx="60" cy="60" r="${r}" fill="none" stroke="var(--pf)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-f)).toFixed(1)}" transform="rotate(-90 60 60)"/>` : ''}

function niceStep(r){ if (!(r > 0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(r))), f = r/e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }

const CHARTS = {};
/* definições SVG de degradê e brilho, uma por gráfico */
function neonDefs(id){
  return `<defs>
    <linearGradient id="${id}-st" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="${id}-ar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".32"/><stop offset=".6" stop-color="#8b5cf6" stop-opacity=".10"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
    <linearGradient id="${id}-bar" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="${id}-cur" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
    <filter id="${id}-glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;
}
/* gráfico de linha neon: pts = [{date, v, note}] em ordem de data */
function lineChart(id, pts, unit, label, dec, opts){
  opts = opts || {};
  if (!pts.length) return '';
  const ts = pts.map(p => Date.parse(p.date + 'T12:00'));
  let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t0 === t1){ t0 -= 7*864e5; t1 += 7*864e5; }
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = (hi - lo) * 0.25 || Math.max(1, Math.abs(hi) * 0.04); lo -= pad; hi += pad;
  if (lo < 0 && Math.min(...pts.map(p => p.v)) >= 0) lo = 0;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const tdec = step < 1 ? 1 : 0;
  const x = t => CL + (t - t0)/(t1 - t0)*(CW - CL - CR), y = v => CT + (hi - v)/(hi - lo)*(CH - CT - CB);
  const P = CHARTS[id] = pts.map((p,i) => ({x:x(ts[i]), y:y(p.v), date:p.date, v:p.v, unit, dec, note:p.note}));
  let grid = '';
  for (let v = lo; v <= hi + step/1e6; v += step){
    const yy = y(v).toFixed(1);
    grid += `<line x1="${CL}" x2="${CW-CR}" y1="${yy}" y2="${yy}" stroke="rgba(130,150,255,.13)" stroke-dasharray="2 5"/><text x="${CL-8}" y="${yy}" dy="4" text-anchor="end" font-size="11" fill="#7f88b0">${fmt(v,tdec)}</text>`;
  }
  const xl = [P[0]]; if (P.length > 1) xl.push(P[P.length-1]);
  const xlab = xl.map((p,i) => `<text x="${p.x.toFixed(1)}" y="${CH-9}" text-anchor="${xl.length===1?'middle':i===0?'start':'end'}" font-size="11" fill="#7f88b0" letter-spacing=".04em">${esc(fmtDate(p.date))}</text>`).join('');
  const line = P.map((p,i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const base = CH - CB;
  const area = P.length > 1 ? `<path d="${line} L${P[P.length-1].x.toFixed(1)} ${base} L${P[0].x.toFixed(1)} ${base} Z" fill="url(#${id}-ar)"/>` : '';
  const last = P[P.length-1];
  const prI = opts.pr ? P.reduce((b, p, i) => p.v > P[b].v ? i : b, 0) : -1;
  const valTxt = fmt(last.v, dec ?? 1) + (unit ? ' ' + unit : '');
  const tw = valTxt.length * 7 + 18, tx = Math.min(Math.max(last.x - tw/2, CL), CW - CR - tw), ty = Math.max(last.y - 34, 2);
  return `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(label)} ao longo do tempo">${neonDefs(id)}
    ${grid}${xlab}${area}
    ${P.length > 1 ? `<path d="${line}" fill="none" stroke="url(#${id}-st)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".35" filter="url(#${id}-glow)"/>
    <path d="${line}" fill="none" stroke="url(#${id}-st)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${P.map((p,i) => i === P.length-1 ? '' : `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.2" fill="#05060d" stroke="#8fe9ff" stroke-width="1.6"/>`).join('')}
    ${prI >= 0 && prI !== P.length-1 ? `<g><circle cx="${P[prI].x.toFixed(1)}" cy="${P[prI].y.toFixed(1)}" r="5" fill="#ec4899" filter="url(#${id}-glow)"/><text x="${P[prI].x.toFixed(1)}" y="${(P[prI].y-10).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#ff9fd0" letter-spacing=".08em">RECORDE</text></g>` : ''}
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="11" fill="#22d3ee" opacity=".18"/>
    <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="5.5" fill="#e9fbff" stroke="${prI === P.length-1 ? '#ec4899' : '#22d3ee'}" stroke-width="2.5" filter="url(#${id}-glow)"/>
    <g><rect x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${tw}" height="22" rx="11" fill="rgba(10,14,34,.9)" stroke="url(#${id}-st)"/>
    <text x="${(tx + tw/2).toFixed(1)}" y="${(ty + 15).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="#eef4ff">${esc(valTxt)}${prI === P.length-1 ? ' ★' : ''}</text></g>
    <line class="xh" x1="0" x2="0" y1="${CT}" y2="${base}" stroke="url(#${id}-st)" stroke-width="1.2" visibility="hidden"/>
    <circle class="xp" r="6.5" fill="#05060d" stroke="#22d3ee" stroke-width="2.5" visibility="hidden" filter="url(#${id}-glow)"/>
    <rect x="0" y="0" width="${CW}" height="${CH}" fill="transparent"/>
  </svg><div class="tip" hidden></div>`;
}
function bindChart(id){
  id = id || 'chart';
  const box = document.getElementById(id), svg = box && box.querySelector('svg'), P = CHARTS[id];
  if (!svg || !P) return;
  const tip = box.querySelector('.tip'), xh = svg.querySelector('.xh'), xp = svg.querySelector('.xp');

    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left)/r.width*CW;
    let best = P[0]; for (const p of P) if (Math.abs(p.x - px) < Math.abs(best.x - px)) best = p;
    xh.setAttribute('x1', best.x); xh.setAttribute('x2', best.x); xh.setAttribute('visibility', 'visible');
    xp.setAttribute('cx', best.x); xp.setAttribute('cy', best.y); xp.setAttribute('visibility', 'visible');
    tip.innerHTML = `<b>${fmt(best.v, best.dec ?? 1)}${best.unit ? ' '+esc(best.unit) : ''}</b>${esc(fmtDate(best.date, true))}${best.note ? ' · ' + esc(best.note) : ''}`;
    tip.style.left = Math.max(16, Math.min(84, best.x/CW*100)) + '%'; tip.style.top = (best.y/CH*100) + '%'; tip.hidden = false;
  };
  const hide = () => { tip.hidden = true; xh.setAttribute('visibility','hidden'); xp.setAttribute('visibility','hidden'); };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);
}

/* ---------- progresso do treino ---------- */
let trainLog = {}, progEx = null, calMonth = null, calSel = null;
const keyOf = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseKg = s => { const m = String(s || '').replace(',', '.').match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const repsNum = s => { const r = String(s || ''); const m = r.match(/(\d+)\s*[-a–]\s*(\d+)/); if (m) return (+m[1] + +m[2]) / 2; const n = r.match(/\d+/); return n ? +n[0] : null; };
const setsOf = l => Object.values((l && l.sets) || {}).reduce((s,n) => s + (+n || 0), 0);
function mondayOf(d){ const m = new Date(d); m.setHours(12,0,0,0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
function trainedDates(){ return Object.keys(trainLog).filter(k => setsOf(trainLog[k]) > 0).sort(); }
function weekCounts(n){
  const mon = mondayOf(today), out = [];
  for (let i = n - 1; i >= 0; i--){
    const s = new Date(mon); s.setDate(mon.getDate() - 7*i);
    let c = 0, sets = 0; for (let j = 0; j < 7; j++){ const d = new Date(s); d.setDate(s.getDate() + j); const q = setsOf(trainLog[keyOf(d)]); if (q > 0){ c++; sets += q; } }
    out.push({start:s, count:c, sets});
  }
  return out;
}
function weekGoal(){ // quantos dias da semana têm treino no plano atual
  if (!plan || !plan.days) return 3;
  const set = new Set(); plan.days.forEach(d => (d.weekdays || []).forEach(w => set.add(w)));
  return set.size || 3;
}
function streakWeeks(){
  const w = weekCounts(104); let i = w.length - 1, s = 0;
  if (w[i].count === 0) i--; // a semana atual ainda está em andamento
  for (; i >= 0 && w[i].count > 0; i--) s++;
  return s;
}
function exerciseSeries(){
  const map = {};
  for (const k of Object.keys(trainLog).sort()){
    const ex = trainLog[k].ex || {};
    for (const [id, e] of Object.entries(ex)){
      if (!(e.n > 0)) continue;
      const key = String(e.name || id).trim().toLowerCase();
      const m = map[key] = map[key] || {id:key, name:e.name, pts:[]};
      m.name = e.name || m.name;
      if (e.kg != null) m.pts.push({date:k, v:e.kg, note: e.n + ' × ' + (e.reps ?? '—')});
    }
  }
  return Object.values(map).filter(m => m.pts.length).sort((a,b) => a.name.localeCompare(b.name, 'pt-BR'));
}
function volumeSeries(){
  return Object.keys(trainLog).sort().map(k => {
    let v = 0, any = false;
    for (const e of Object.values(trainLog[k].ex || {})) if (e.n > 0 && e.kg != null && e.reps != null){ v += e.n * e.reps * e.kg; any = true; }
    return any ? {date:k, v, note: trainLog[k].label || ''} : null;
  }).filter(Boolean);
}
/* barras neon de treinos por semana, com a linha da meta */
function barsSVG(weeks, goal){
  const id = 'wk', W = 400, H = 200, L = 8, R = 8, T = 28, B = 30, n = weeks.length;
  const max = Math.max(goal + 1, ...weeks.map(w => w.count));
  const slot = (W - L - R) / n, bw = Math.min(20, slot * 0.56), yv = v => H - B - (H - T - B) * v / max;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Treinos por semana nas últimas ${n} semanas, meta de ${goal}">${neonDefs(id)}`;
  weeks.forEach((w,i) => {
    const cx = L + slot*i + slot/2, cur = i === n - 1;
    s += `<rect x="${(cx-bw/2).toFixed(1)}" y="${T}" width="${bw}" height="${H-B-T}" rx="${bw/2}" fill="rgba(130,150,255,.06)"/>`;
    if (w.count){
      const y = yv(w.count), h = H - B - y, hit = w.count >= goal;
      s += `<rect x="${(cx-bw/2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="${bw/2}" fill="url(#${id}-${cur ? 'cur' : 'bar'})" ${hit || cur ? `filter="url(#${id}-glow)"` : 'opacity=".8"'}><title>Semana de ${fmtDate(keyOf(w.start))}: ${w.count} treino${w.count===1?'':'s'}</title></rect>
        <text x="${cx.toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="${hit ? '#9befff' : '#cfd6ff'}">${w.count}</text>`;
    }
    if (i % 3 === 0 || cur) s += `<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="${cur ? '#ff9fd0' : '#7f88b0'}" font-weight="${cur ? 700 : 400}">${cur ? 'ESTA' : esc(fmtDate(keyOf(w.start)))}</text>`;
  });
  const gy = yv(goal).toFixed(1);
  s += `<line x1="${L}" x2="${W-R}" y1="${gy}" y2="${gy}" stroke="#34f5a4" stroke-width="1.3" stroke-dasharray="5 5" opacity=".85"/>
    <rect x="${W-R-62}" y="${(gy-19)}" width="62" height="16" rx="8" fill="rgba(52,245,164,.14)" stroke="rgba(52,245,164,.5)"/>
    <text x="${W-R-31}" y="${(+gy-7.5)}" text-anchor="middle" font-size="10" font-weight="700" fill="#9dffd2" letter-spacing=".06em">META ${goal}</text>`;
  return s + '</svg>';
}
/* anel de progresso da semana */
function weekRing(done, goal){
  const r = 44, C = 2*Math.PI*r, f = Math.min(1, goal ? done/goal : 0);
  return `<svg viewBox="0 0 120 120" class="ring-svg" aria-hidden="true">${neonDefs('rg')}
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(130,150,255,.14)" stroke-width="10"/>
    ${f > 0 ? `<circle cx="60" cy="60" r="${r}" fill="none" stroke="url(#rg-st)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-f)).toFixed(1)}" transform="rotate(-90 60 60)" filter="url(#rg-glow)"/>` : ''}
    <text x="60" y="58" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="28" fill="#f2f5ff">${done}<tspan font-size="16" fill="#8e97bd">/${goal}</tspan></text>
    <text x="60" y="78" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7fe6f7" letter-spacing=".14em">TREINOS</text>
  </svg>`;
}

/* ---------- calendário do mês ---------- */
const MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function dayInfo(k, d){
  const l = trainLog[k], sets = setsOf(l), wd = d.getDay(), planned = dayFor(wd);
  const first = trainedDates()[0];
  if (sets > 0) return {st:'done', sets, label:l.label || (planned ? planned.label : 'Treino'), badge: l.label ? badgeOf({label:l.label.split(' + ')[0]}) : planned ? badgeOf(planned) : '✓', day:planned};
  if (k === logKey) return {st: planned ? 'today' : 'rest', day:planned, badge: planned ? badgeOf(planned) : ''};
  if (k > logKey) return {st: planned ? 'plan' : 'rest', day:planned, badge: planned ? badgeOf(planned) : ''};
  if (planned && first && k > first) return {st:'miss', day:planned, badge: badgeOf(planned)};
  return {st:'rest', day:planned};
}
function calendarCard(){
  if (!calMonth) calMonth = new Date(today.getFullYear(), today.getMonth(), 1, 12);
  if (!calSel) calSel = logKey;
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), days = new Date(y, m + 1, 0).getDate();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  let cells = '', done = 0, miss = 0;
  for (let i = 0; i < lead; i++) cells += '<span class="cal-cell empty"></span>';
  for (let dn = 1; dn <= days; dn++){
    const d = new Date(y, m, dn, 12), k = keyOf(d), info = dayInfo(k, d);
    if (info.st === 'done') done++; if (info.st === 'miss') miss++;
    const lvl = info.st === 'done' ? (info.sets >= 16 ? 3 : info.sets >= 8 ? 2 : 1) : 0;
    const pc = info.day ? pcOf(info.day) : '';
    cells += `<button class="cal-cell ${info.st}${lvl ? ' l' + lvl : ''}${k === logKey ? ' is-today' : ''}${k === calSel ? ' sel' : ''}" data-act="calday" data-k="${k}" style="${pc}" aria-label="${esc(fmtDate(k, true))}: ${{done:'treinou', miss:'faltou', plan:'treino programado', today:'treino de hoje', rest:'descanso'}[info.st]}">
      <span class="cal-n">${dn}</span>${info.badge && info.st !== 'rest' ? `<span class="cal-b">${esc(info.badge)}</span>` : ''}</button>`;
  }
  const canNext = new Date(y, m + 1, 1) <= new Date(today.getFullYear(), today.getMonth() + 2, 1);
  return `<div class="card cal-card"><div class="card-top"><h2>Calendário</h2>
      <div class="cal-nav"><button class="mini" data-act="calprev" aria-label="Mês anterior">${icon.up.replace('M6 15l6-6 6 6','M15 6l-6 6 6 6')}</button>
      <b>${MES[m]} ${y}</b>
      <button class="mini" data-act="calnext" aria-label="Próximo mês" ${canNext ? '' : 'disabled'}>${icon.up.replace('M6 15l6-6 6 6','M9 6l6 6-6 6')}</button></div></div>
    <div class="cal-sum"><span class="cs done"><i></i>${done} treino${done===1?'':'s'}</span>${miss ? `<span class="cs miss"><i></i>${miss} falta${miss===1?'':'s'}</span>` : ''}</div>
    <div class="cal-grid">${['seg','ter','qua','qui','sex','sáb','dom'].map(t => `<span class="cal-h">${t}</span>`).join('')}${cells}</div>
    <div class="cal-legend"><span><i class="lg-done"></i>Treinou</span><span><i class="lg-plan"></i>Programado</span><span><i class="lg-miss"></i>Faltou</span><span><i class="lg-rest"></i>Descanso</span></div>
    ${calDetail()}
  </div>`;
}
function calDetail(){
  const k = calSel; if (!k) return '';
  const d = new Date(k + 'T12:00'), info = dayInfo(k, d), l = trainLog[k];
  const head = `<span class="eyebrow">${esc(WD_FULL[d.getDay()])}, ${d.getDate()} de ${MONTHS[d.getMonth()]}</span>`;
  if (info.st === 'done'){
    const ex = Object.values(l.ex || {}).filter(e => e.n > 0);
    return `<div class="cal-det done">${head}<b>${esc(info.label)} · ${info.sets} séries</b>
      ${ex.length ? `<ul>${ex.map(e => `<li><span>${esc(e.name)}</span><em>${e.n}×${e.reps ?? '—'}${e.kg != null ? ' · ' + fmt(e.kg) + ' kg' : ''}</em></li>`).join('')}</ul>` : '<p class="muted" style="margin:0">Séries marcadas sem detalhes de carga.</p>'}</div>`;
  }
  const txt = {miss:'Treino programado que não foi marcado.', plan:'Treino programado para este dia.', today:'Treino de hoje: marque as séries na aba Treino.', rest:'Dia de descanso.'}[info.st];
  return `<div class="cal-det ${info.st}">${head}<b>${info.day ? esc(info.day.label) + (info.day.focus ? ' · ' + esc(info.day.focus) : '') : 'Descanso'}</b><p class="muted" style="margin:0">${txt}</p></div>`;
}

function renderProg(){

        <div><small>Atual</small><b>${fmt(last.v)}<i>kg</i></b></div>

        <div class="${diff > 0 ? 'up' : diff < 0 ? 'down' : ''}"><small>Evolução</small><b>${sel.pts.length > 1 ? (diff > 0 ? '+' : '') + fmt(diff) : '—'}<i>${sel.pts.length > 1 ? 'kg' : ''}</i></b><em>${sel.pts.length > 1 ? 'desde ' + esc(fmtDate(first.date)) : '1º registro'}</em></div>

  app.innerHTML = `${topbar()}${hero}

function currentWeight(){ const w = measures.filter(e => e.weight != null); return w.length ? w[w.length-1].weight : null; }
function metaRange(lo, hi){
  lo = num(lo); hi = num(hi);
  if (lo == null && hi == null) return {min:null, max:null};
  if (lo == null || hi == null || Math.abs(lo - hi) < 0.05) return {min:null, max: lo ?? hi};
  return {min: Math.min(lo, hi), max: Math.max(lo, hi)};
}
function metaPreview(d){
  const r = metaRange(d.targetMin, d.target), w = currentWeight();
  if (r.max == null) return w != null ? `Seu peso atual é ${fmt(w)} kg. Preencha a meta acima.` : 'Preencha a meta acima.';
  const txt = r.min != null ? `Meta: entre ${fmt(r.min)} e ${fmt(r.max)} kg` : `Meta: ${fmt(r.max)} kg`;
  if (w == null) return txt + '.';
  const lo = r.min ?? r.max;
  if (r.min != null && (Math.abs(r.min - w) < 0.6 || Math.abs(r.max - w) < 0.6))
    return `Atenção: ${fmt(w)} kg é o seu peso de hoje. Aqui vai só onde você quer chegar (ex.: entre 78 e 82, ou só 80).`;
  if (w > r.max + 0.05) return `${txt}. Hoje você está com ${fmt(w)} kg: faltam ${fmt(w - r.max)} kg para chegar.`;
  if (w < lo - 0.05) return `${txt}. Hoje você está com ${fmt(w)} kg: faltam ${fmt(lo - w)} kg para subir até a meta.`;
  return `${txt}. Hoje você está com ${fmt(w)} kg: já está dentro da meta!`;
}

}
function togglePeek(b){
  const id = b.dataset.for, i = document.getElementById(id); if (!i) return;
  if (peekOn.has(id)) peekOn.delete(id); else peekOn.add(id);
  const on = peekOn.has(id);
  i.type = on ? 'text' : 'password';
  b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'Esconder senha' : 'Mostrar senha');

}

function authMsg(e){
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'E-mail ou senha incorretos. Se você criou a conta com o Google, use "Continuar com Google".';
  if (c.includes('email-already-in-use')) return 'Já existe uma conta com esse e-mail. Toque em "Entrar" (ou use "Continuar com Google", se foi assim que você criou).';
  if (c.includes('weak-password')) return 'Senha fraca: use pelo menos 6 caracteres.';
  if (c.includes('invalid-email') || c.includes('missing-email')) return 'Esse e-mail não parece válido. Confira se digitou certo.';
  if (c.includes('too-many-requests')) return 'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';
  if (c.includes('network-request-failed')) return 'Sem conexão com a internet. Confira e tente de novo.';
  if (c.includes('operation-not-allowed')) return 'O login por e-mail ainda não está ativado neste app.';
  if (c.includes('unauthorized-domain')) return 'Este endereço ainda não foi autorizado no Firebase.';
  if (c.includes('popup-closed') || c.includes('cancelled')) return 'A janela do Google foi fechada antes de terminar. Tente de novo.';
  if (c.includes('popup-blocked')) return 'O navegador bloqueou a janela do Google. Permita pop-ups ou use e-mail e senha.';
  return 'Não deu para continuar agora (' + (c || 'erro desconhecido') + '). Tente de novo.';
}

async function doEmailAuth(){

  if (loginMode !== 'reset' && lg.pass.length < 6){ loginErr = 'A senha precisa ter pelo menos 6 caracteres.'; render(); return; }
  if (loginMode === 'up' && lg.pass !== lg.pass2){ loginErr = 'As duas senhas não são iguais.'; render(); return; }
  loginBusy = true; render();
  try {
    if (loginMode === 'reset'){
      await cloudRef.resetPassword(email);
      loginMsg = 'Pronto! Enviamos um link para ' + email + '. Abra o e-mail (confira também o spam) e crie a senha nova.';
      loginMode = 'in'; loginBusy = false; render(); return;

    if (loginMode === 'up') await cloudRef.signUpEmail(lg.name.trim(), email, lg.pass);
    else await cloudRef.signInEmail(email, lg.pass);
    lg.pass = lg.pass2 = '';

}

async function doChangePassword(){
  const has = pwHasPass();
  pw.err = ''; pw.msg = '';
  if (has && !pw.cur){ pw.err = 'Digite a sua senha atual.'; renderAccount(); pwFocus(); return; }
  if (pw.n1.length < 6){ pw.err = 'A nova senha precisa ter pelo menos 6 caracteres.'; renderAccount(); return; }
  if (pw.n1 !== pw.n2){ pw.err = 'As duas senhas novas não são iguais.'; pw.n2 = ''; renderAccount(); return; }
  if (has && pw.n1 === pw.cur){ pw.err = 'A nova senha é igual à atual. Escolha outra.'; renderAccount(); return; }
  pw.busy = true; renderAccount();
  try {
    if (has) await cloudRef.changePassword(pw.cur, pw.n1);
    else await cloudRef.addPassword(pw.n1);
    pwReset();
    pw.msg = has ? 'Senha alterada! Use a nova senha da próxima vez que entrar.' : 'Senha criada! Agora você também pode entrar com ' + account.email + ' e essa senha.';
  } catch(e){
    const c = (e && e.code) || '';
    pw.busy = false; pw.cur = ''; pw.n2 = '';
    pw.err = /invalid-credential|wrong-password|invalid-login/.test(c) ? 'A senha atual está incorreta.'
      : c.includes('provider-already-linked') || c.includes('credential-already-in-use') ? 'Esta conta já tem senha. Feche e abra de novo para alterar.'
      : c.includes('user-mismatch') ? 'Escolha no Google a mesma conta que está usando aqui (' + account.email + ').'
      : c.includes('requires-recent-login') ? 'Por segurança, saia da conta, entre de novo e tente outra vez.'
      : authMsg(e);
  }
  renderAccount();
}

function backupData(){

function downloadBackup(){

    const blob = new Blob([JSON.stringify(backupData(), null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'treino-backup-' + logKey + '.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

async function applyBackup(obj){
  if (!obj || obj.app !== 'treino-do-dia' || !(obj.plan || obj.measures || obj.profile)){ toast('Esse arquivo não é um backup do Treino do Dia.'); return; }
  plan = obj.plan || null; profile = obj.profile || null;
  measures = (obj.measures || []).filter(m => m && m.id && m.date); sortM();
  trainLog = obj.logs || {}; waterLog = obj.water || {}; local.set('water', waterLog); log = trainLog[logKey] || {sets:{}}; if (!log.sets) log.sets = {};
  local.set('plan/current', plan); local.set('profile/me', profile); local.set('measures', measures); local.set('history', trainLog);
  if (mode === 'db'){
    toast('Restaurando…');
    const writes = [];
    if (plan) writes.push(db.doc('plan/current').set(clone(plan)));
    if (profile) writes.push(db.doc('profile/me').set(clone(profile)));
    for (const m of measures){ const b = clone(m); delete b.id; writes.push(db.collection('measures').doc(m.id).set(b)); }
    for (const [k, v] of Object.entries(trainLog)) if (/^\d{4}-\d{2}-\d{2}$/.test(k)) writes.push(db.doc('logs/' + k).set(clone(v)));
    for (const [k, v] of Object.entries(waterLog)) if (/^\d{4}-\d{2}-\d{2}$/.test(k)) writes.push(db.doc('water/' + k).set(clone(v)));
    try { await Promise.race([Promise.all(writes), new Promise(r => setTimeout(r, 6000))]); }
    catch(e){ toast('Parte do backup não foi salva na conta. Tente de novo com internet.'); return; }
  }
  closeSheet(); view = 'today'; render(); toast('Backup restaurado');
}
