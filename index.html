<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.cloudReady = new Promise(function (r) { window.__cloudResolve = r; }); setTimeout(function () { window.__cloudResolve && window.__cloudResolve(null); }, 20000);</script>

<title>Treino do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de uma coluna. Cartão "ferro" escuro com a anilha de progresso abre a tela; cada treino veste a cor de uma anilha olímpica (vermelho 25, azul 20, amarelo 15, verde 10, branco 5); navegação fixa embaixo */
:root{
  --bg:#eceef2; --surface:#ffffff; --surface-2:#f3f4f7; --fg:#0f1115; --muted:#5e6472; --line:#dcdfe6;
  --accent:#d6301f; --accent-fg:#ffffff; --accent-soft:#fbe4e1;
  --done:#12804a; --done-soft:#dcf1e5; --danger:#c0261a;
  --iron:#15171c; --iron-2:#22252c; --iron-fg:#f4f5f7; --iron-muted:#a0a6b3; --iron-line:#30343c;
  --scrim:rgba(8,10,14,.5); --shadow:0 1px 2px rgba(15,17,21,.06),0 8px 24px -12px rgba(15,17,21,.18);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --nav:68px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0f; --surface:#15171b; --surface-2:#1c1f24; --fg:#f1f2f5; --muted:#959baa; --line:#272a31;
  --accent:#ff5a45; --accent-fg:#0b0c0f; --accent-soft:#3a1712;
  --done:#3fd089; --done-soft:#0f2a1c; --danger:#ff8a7d;
  --iron:#1b1e23; --iron-2:#262a31; --iron-fg:#f4f5f7; --iron-muted:#a0a6b3; --iron-line:#343841;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b0c0f; --surface:#15171b; --surface-2:#1c1f24; --fg:#f1f2f5; --muted:#959baa; --line:#272a31;
  --accent:#ff5a45; --accent-fg:#0b0c0f; --accent-soft:#3a1712;
  --done:#3fd089; --done-soft:#0f2a1c; --danger:#ff8a7d;
  --iron:#1b1e23; --iron-2:#262a31; --iron-fg:#f4f5f7; --iron-muted:#a0a6b3; --iron-line:#343841;
  --scrim:rgba(0,0,0,.65); --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--nav) + 36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.wrap.nonav{padding-bottom:24px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:.95;text-transform:uppercase}
h1{font-size:2.9rem}
h2{font-size:1.6rem}
.eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}
.lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:10px}
.head{display:flex;flex-direction:column;gap:8px}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:6px}
.topbar .brand{font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.topbar .brand i{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 5px var(--accent),inset 0 0 0 7px var(--bg);display:block}

/* cartão ferro (hero) */
.hero{background:var(--iron);color:var(--iron-fg);border-radius:24px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.018) 10px 11px);pointer-events:none}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pc,var(--accent))}
.hero > *{position:relative}
.hero-top{display:flex;justify-content:space-between;gap:14px;align-items:center}
.hero .eyebrow{color:var(--iron-muted)}
.hero h1{font-size:3.6rem;line-height:.88;margin-top:6px}
.hero .focus{margin:8px 0 0;color:var(--iron-muted);font-weight:600;font-size:1rem}
.hero-meta{display:flex;gap:8px;flex-wrap:wrap}
.hero-meta span{font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--iron-2);color:var(--iron-fg);font-variant-numeric:tabular-nums}
.hero.complete::after{background:var(--done)}
.plate{flex:none;width:118px;height:118px}
.plate svg{width:100%;height:100%;display:block;overflow:visible}
.plate .ring{transition:stroke-dashoffset .5s cubic-bezier(.3,.7,.2,1)}
@media (max-width:370px){.hero h1{font-size:3rem}.plate{width:96px;height:96px}}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:var(--r);padding:8px;box-shadow:var(--shadow)}
.wk{border:0;background:none;border-radius:12px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;line-height:1}
.wk small{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk .badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1rem;background:var(--pc);color:var(--pf);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.wk.off .badge{background:none;border:1.5px dashed var(--line);color:var(--muted);box-shadow:none;font-family:var(--body);font-size:.8rem}
.wk span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.wk.today small,.wk.today span{color:var(--accent)}
.wk[aria-pressed="true"]{background:var(--surface-2)}
.wk[aria-pressed="true"] .badge{box-shadow:0 0 0 2px var(--surface-2),0 0 0 4px var(--pc)}
.wk.off[aria-pressed="true"] .badge{box-shadow:none;border-color:var(--muted)}

/* lista de exercícios */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-head h2{font-size:1.5rem}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex{display:flex;align-items:stretch;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;transition:background .2s}
.ex-body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:14px 6px 14px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center}
.ex-num{grid-row:span 3;font-family:var(--display);font-weight:900;font-size:2.3rem;line-height:1;color:var(--line);font-variant-numeric:tabular-nums;width:1.4em;text-align:center}
.ex-name{font-weight:800;font-size:1.02rem;line-height:1.2}
.ex-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.82rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ex-meta b{color:var(--fg);font-weight:800}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.dots i.on{background:var(--done);box-shadow:none}
.check{flex:none;width:64px;border:0;background:none;display:grid;place-items:center;border-left:1px solid var(--line)}
.check i{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s}
.check svg{width:17px;height:17px;opacity:0}
.check:active i{transform:scale(.9)}
.ex.done{background:var(--done-soft);box-shadow:none}
.ex.done .ex-num{color:var(--done);opacity:.5}
.ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--done);text-decoration-thickness:2px}
.ex.done .check{border-left-color:transparent}
.ex.done .check i{background:var(--done);border-color:var(--done)}
.ex.done .check svg{opacity:1;color:var(--surface)}
.go{display:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;line-height:1.15;text-align:left}
.chip .dot{width:22px;height:22px;border-radius:50%;background:var(--pc,var(--accent));color:var(--pf,#fff);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:.8rem;flex:none}
.chip b{font-weight:700;font-size:.88rem;display:block}
.chip small{font-size:.74rem;color:var(--muted);display:block}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.7}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:10px}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;flex-direction:column;align-items:center;gap:6px}
.foot small{color:var(--muted);font-size:.76rem;text-align:center}

.rest{background:var(--surface);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.empty{background:var(--surface);border-radius:var(--r);padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.empty p{margin:0}
.note{font-size:.85rem;padding:12px 14px;border-radius:14px;background:var(--accent-soft);margin:0}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
/* calendário de treinos */
.hm-wrap{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:stretch}
.hm-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.hm-days span{font-size:.64rem;font-weight:700;color:var(--muted);display:flex;align-items:center}
.hm-grid{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;min-width:0}
.hm-col{display:grid;grid-template-rows:repeat(7,auto);gap:3px}
.hm{display:block;width:100%;aspect-ratio:1;border-radius:4px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.hm.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface));box-shadow:none}
.hm.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface));box-shadow:none}
.hm.l3{background:color-mix(in srgb,var(--accent) 78%,var(--surface));box-shadow:none}
.hm.l4{background:var(--accent);box-shadow:none}
.hm.lx{background:none;box-shadow:inset 0 0 0 1px var(--line);opacity:.35}
.hm.now{outline:2px solid var(--fg);outline-offset:1px}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600;margin-top:4px}
.hm-legend span:first-child{margin-right:4px}.hm-legend span:last-child{margin-left:4px}
.hm-legend .hm{width:12px;height:12px;aspect-ratio:auto;border-radius:3px}
.nav button{border:0;background:none;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:700}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"] svg{color:var(--accent)}

/* folha de detalhes */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:18px;animation:up .26s cubic-bezier(.2,.8,.2,1);border-top:6px solid var(--pc,var(--accent))}
@keyframes up{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.plate .ring{transition:none}.set.on{animation:none!important}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-top h2{font-size:2.1rem}
.x{border:0;background:var(--surface-2);border-radius:50%;width:38px;height:38px;flex:none;display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat small{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat b{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat input{width:100%;border:0;background:none;padding:0;font-family:var(--display);font-size:1.9rem;font-weight:800;line-height:1;outline-offset:4px}
.stat input::placeholder{color:var(--muted);opacity:.5}
.stat.edit{box-shadow:inset 0 0 0 1.5px var(--line)}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:none;font-family:var(--display);font-weight:900;font-size:1.3rem;font-variant-numeric:tabular-nums}
.set.on{background:var(--done);border-color:var(--done);color:var(--surface);animation:pop .25s}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--iron);color:var(--iron-fg);border-radius:18px;padding:14px 14px 14px 20px}
.clock{font-family:var(--display);font-size:3.2rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.timer.running .clock{color:var(--pc,var(--accent))}
.timer.over .clock{color:var(--done)}
.timer .btn{background:var(--iron-2);border-color:var(--iron-line);color:var(--iron-fg)}
.timer .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.notes{margin:0;white-space:pre-wrap;line-height:1.55}
.video{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:18px;background:var(--iron);color:var(--iron-fg);text-decoration:none;position:relative;overflow:hidden}
.video::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:14px solid var(--pc,var(--accent));opacity:.25}
.video .pb{width:52px;height:52px;border-radius:50%;background:var(--pc,var(--accent));color:var(--pf,#fff);display:grid;place-items:center;flex:none}
.video .pb svg{width:22px;height:22px;margin-left:3px}
.video b{display:block;font-size:1.05rem;font-weight:800}
.guide{gap:0}
.guide summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.guide summary::-webkit-details-marker{display:none}
.guide summary > span:first-child{display:flex;flex-direction:column;gap:4px}
.guide summary b{font-family:var(--display);font-weight:800;font-size:1.35rem;text-transform:uppercase;line-height:1}
.guide .chev{font-size:1.6rem;color:var(--muted);transition:transform .2s}
.guide[open] .chev{transform:rotate(90deg)}
.g-body{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.g-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.g-list li{position:relative;padding-left:22px;line-height:1.45}
.g-list li::before{content:"";position:absolute;left:2px;top:.45em;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
.motto{margin:0;padding:14px 16px;border-radius:14px;background:var(--iron);color:var(--iron-fg);font-family:var(--display);font-weight:800;font-size:1.2rem;text-transform:uppercase;line-height:1.1}
.vids{display:flex;flex-direction:column;gap:8px}
.vid-alt{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface-2);color:var(--fg);text-decoration:none}
.vid-alt .pb{width:34px;height:34px;border-radius:50%;background:var(--pc,var(--accent));color:var(--pf,#fff);display:grid;place-items:center;flex:none}
.vid-alt .pb svg{width:14px;height:14px;margin-left:2px}
.vid-alt b{display:block;font-weight:800;font-size:.95rem}
.vid-alt small{color:var(--muted);font-weight:600;font-size:.78rem}
.vid-ed{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.vid-ed input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.vid-save{display:flex;flex-direction:column;gap:8px;margin-top:-6px;padding:14px;border-radius:16px;background:var(--surface-2)}
.vid-save p{margin:0;font-size:.85rem;color:var(--muted);line-height:1.45}
.vid-row{display:flex;gap:8px}
.vid-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.vid-row input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.vid-row .btn{padding:10px 16px}
.video small{color:var(--iron-muted);font-weight:600}

/* semana no editor */
.sched{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.sched h2{font-size:1.5rem;margin-bottom:4px}
.wk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:7px;border-top:1px solid var(--line)}
.wk-row:first-of-type{border-top:0}
.wk-row label{font-weight:700;text-transform:capitalize}
.wk-row select{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 11px;min-width:0;max-width:62%}
.wk-row.rest select{color:var(--muted)}

/* meu corpo */
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card h2{font-size:1.5rem}
.prof{display:flex;flex-wrap:wrap;gap:8px}
.prof div{display:flex;flex-direction:column;background:var(--surface-2);border-radius:12px;padding:8px 12px}
.prof small{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.prof b{font-weight:800}
.big{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big b{font-family:var(--display);font-weight:900;font-size:5rem;line-height:.82;font-variant-numeric:tabular-nums}
.big span{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--iron-muted);padding-bottom:4px}
.delta{font-size:.85rem;font-weight:700;color:var(--iron-muted);font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.tile small{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile b{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.tile b span{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--muted);margin-left:4px}
.tile em{font-style:normal;font-size:.74rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{align-self:flex-start;font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--fg)}
.hero .pill{background:var(--iron-2);color:var(--iron-fg)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:.8rem;padding:6px 10px;border-radius:10px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;font-variant-numeric:tabular-nums}
.chart .tip b{display:block;font-size:.95rem}
.card .chip{box-shadow:none;background:var(--surface-2);padding:8px 12px;border-radius:12px}
.card .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li+li{border-top:1px solid var(--line)}
.hist button{width:100%;border:0;background:none;text-align:left;padding:12px 2px;display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center}
.hist .d{font-weight:800}
.hist .v{color:var(--muted);font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .go2{color:var(--muted);font-size:1.3rem}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kv div{background:var(--surface-2);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;min-width:0}
.kv small{font-size:.72rem;color:var(--muted);font-weight:600}
.kv b{font-variant-numeric:tabular-nums;font-weight:800}
.kv em{font-style:normal;font-size:.72rem;color:var(--muted)}

/* formulários */
.ed-day{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);border-left:6px solid var(--pc,var(--accent))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:500px){.fgrid{grid-template-columns:repeat(3,1fr)}}
.unit{position:relative}
.unit input{padding-right:46px}
.unit i{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-style:normal;font-size:.76rem;font-weight:700;color:var(--muted);pointer-events:none}
.ed-ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ed-ex-head{display:flex;align-items:center;gap:6px}
.ed-ex-head .num{font-family:var(--display);font-weight:900;font-size:1.5rem;color:var(--muted);width:24px;flex:none}
.ed-ex-head .field{flex:1}
.mini{border:1px solid var(--line);background:none;border-radius:10px;width:36px;height:36px;flex:none;display:grid;place-items:center;align-self:flex-end}
.mini:disabled{opacity:.3}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:400px){.grid4{grid-template-columns:repeat(2,1fr)}}
.savebar{position:sticky;bottom:0;z-index:5;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;border-top:1px solid var(--line)}
.savebar .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:.9rem;font-weight:700;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.tb-right{display:flex;align-items:center;gap:10px}
.acct{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg);padding:0}
.acct svg{width:18px;height:18px}
</style>
</head>

const local = {
  get(k){ try{ return JSON.parse(localStorage.getItem('treino:'+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem('treino:'+k, JSON.stringify(v)); }catch(e){} }
};
const timers = {}, queues = {};
function save(path, data){
  local.set(path, data);
  if (mode !== 'db') return;
  clearTimeout(timers[path]);
  timers[path] = setTimeout(() => {
    const body = clone(data);
    queues[path] = (queues[path] || Promise.resolve())
      .then(() => db.doc(path).set(body))
      .catch(e => toast(e && e.code === 'quota_exceeded' ? 'Espaço cheio: não deu para salvar.' : 'Não deu para salvar agora. Confira sua conexão.'));
  }, 350);
}
const savePlan = () => save('plan/current', plan);
function saveLog(){
  // guarda, para cada exercício feito hoje, as séries, a carga e as repetições do dia (base dos gráficos de progresso)
  const ex = {}, labels = new Set();
  for (const [id, n] of Object.entries(log.sets || {})){
    if (!(n > 0)) continue;
    const e = findEx(id);
    if (!e){ if (log.ex && log.ex[id]) ex[id] = log.ex[id]; continue; }
    ex[id] = {n, kg: parseKg(e.load), reps: repsNum(e.reps), name: e.name};
    const d = dayOfEx(id); if (d) labels.add(d.label);
  }
  log.ex = ex; log.label = [...labels].join(' + ');
  trainLog[logKey] = log; local.set('history', trainLog);
  save('logs/'+logKey, log);
}

  if (location.hash === '#corpo') view = 'body';

}

  const trained = WEEK_ORDER.filter(w => dayFor(w, draft)).length;
  el.innerHTML = `<h2>Sua semana</h2><p class="muted" style="margin:0 0 6px">${trained} ${trained===1?'dia':'dias'} de treino, ${7-trained} de descanso.</p>

function assign(w, id){
  for (const d of draft.days) d.weekdays = (d.weekdays||[]).filter(x => x !== w);
  const d = draft.days.find(x => x.id === id); if (d) d.weekdays.push(w);
}
function commitEditor(){
  for (const d of draft.days){
    d.label = d.label.trim() || 'Treino';
    d.exercises = d.exercises.filter(e => e.name.trim());
    for (const e of d.exercises){
      e.name = e.name.trim();
      e.sets = Math.max(0, Math.min(20, parseInt(e.sets) || 0));
      e.rest = Math.max(0, Math.min(900, parseInt(e.rest) || 0));
      e.video = cleanVideo(e.video) || '';
      // o campo do editor é o vídeo principal; mantém as outras versões
      if (e.videos && e.videos.length){
        if (e.video){ if (e.videos[0].url !== e.video) e.videos[0] = {label:e.videos[0].label || '', url:e.video}; }
        else { e.videos.shift(); e.video = e.videos[0] ? e.videos[0].url : ''; }
      }
    }
  }
  plan = draft; draft = null; view = 'today'; viewDayId = null;
  savePlan(); render(); window.scrollTo(0,0); toast('Plano salvo');
}

const FIELD = {}; GROUPS.forEach(g => g.items.forEach(([k,l,u]) => FIELD[k] = {label:l, unit:u}));
FIELD.bmi = {label:'IMC', unit:''};
const SK = ['skTriceps','skSubscap','skChest','skAxilla','skSuprailiac','skAbdomen','skThigh'];
const SEX = {M:'Masculino', F:'Feminino'};
const GOALS = ['Hipertrofia','Emagrecimento','Definição','Condicionamento','Força','Manutenção','Saúde'];

const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = (n, d = 1) => n == null || !isFinite(n) ? '—' : n.toLocaleString('pt-BR', {maximumFractionDigits:d, minimumFractionDigits:0});
const fmtDate = (s, withYear) => { const [y,m,d] = String(s).split('-').map(Number); if (!m) return String(s); return d + ' ' + MONTHS[m-1].slice(0,3) + (withYear || y !== today.getFullYear() ? ' ' + y : ''); };
const sortM = () => measures.sort((a,b) => String(a.date).localeCompare(String(b.date)));
function age(){
  if (!profile) return null;
  if (!profile.birth){ const a = num(profile.age); return a > 0 && a < 120 ? Math.round(a) : null; }
  const b = new Date(profile.birth + 'T12:00'); if (isNaN(b)) return null;
  let a = today.getFullYear() - b.getFullYear();
  if (today.getMonth() < b.getMonth() || (today.getMonth() === b.getMonth() && today.getDate() < b.getDate())) a--;
  return a > 0 && a < 120 ? a : null;
}
function derived(e){
  const hcm = profile ? num(profile.height) : null, h = hcm ? hcm/100 : null, a = age(), sex = profile && profile.sex, o = {};
  if (e.weight && h) o.bmi = e.weight/(h*h);
  if (e.waist && e.hip) o.whr = e.waist/e.hip;
  if (e.waist && hcm) o.whtr = e.waist/hcm;
  if (e.weight && e.fatPct != null && e.fatKg == null) o.fatKg = e.weight*e.fatPct/100;
  if (e.weight && e.fatPct != null && e.leanKg == null) o.leanKg = e.weight*(1 - e.fatPct/100);
  const have = SK.filter(k => e[k] != null);
  if (have.length){ o.skSum = have.reduce((s,k) => s + e[k], 0); o.skN = have.length; }
  if (have.length === 7 && a && SEX[sex]){
    const S = o.skSum;
    const bd = sex === 'M' ? 1.112 - 0.00043499*S + 0.00000055*S*S - 0.00028826*a : 1.097 - 0.00046971*S + 0.00000056*S*S - 0.00012828*a;
    o.pollock = 495/bd - 450;
  }
  if (e.bmr == null && e.weight && hcm && a && SEX[sex]) o.bmrEst = 10*e.weight + 6.25*hcm - 5*a + (sex === 'M' ? 5 : -161);
  return o;
}
function val(e, k){ return k === 'bmi' ? derived(e).bmi ?? null : (e[k] ?? null); }
function bmiClass(b){ return b < 18.5 ? 'Abaixo do peso' : b < 25 ? 'Peso normal' : b < 30 ? 'Sobrepeso' : b < 35 ? 'Obesidade grau I' : b < 40 ? 'Obesidade grau II' : 'Obesidade grau III'; }
function lastTwo(k){
  const w = measures.filter(e => val(e,k) != null);
  return [w[w.length-1] || null, w[w.length-2] || null];
}
function tabs(cur){

}

function saveMeasure(e){
  const i = measures.findIndex(x => x.id === e.id);
  if (i >= 0) measures[i] = e; else measures.push(e);
  sortM(); local.set('measures', measures);
  if (mode !== 'db') return;
  const body = clone(e); delete body.id;
  queues['m:'+e.id] = (queues['m:'+e.id] || Promise.resolve()).then(() => db.collection('measures').doc(e.id).set(body))
    .catch(() => toast('Não deu para salvar a medição. Confira sua conexão.'));
}
function deleteMeasure(id){
  measures = measures.filter(x => x.id !== id); local.set('measures', measures);
  if (mode === 'db') db.collection('measures').doc(id).delete().catch(() => toast('Não deu para excluir agora. Confira sua conexão.'));
}

function niceStep(r){ if (!(r > 0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(r))), f = r/e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
const CW = 400, CH = 220, CL = 42, CR = 14, CT = 20, CB = 28;
const CHARTS = {};
/* gráfico de linha genérico: pts = [{date, v}] em ordem de data */
function lineChart(id, pts, unit, label, dec){
  if (!pts.length) return '';
  const ts = pts.map(p => Date.parse(p.date + 'T12:00'));
  let t0 = Math.min(...ts), t1 = Math.max(...ts); if (t0 === t1){ t0 -= 7*864e5; t1 += 7*864e5; }
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  const pad = (hi - lo) * 0.2 || Math.max(1, Math.abs(hi) * 0.03); lo -= pad; hi += pad;
  if (lo < 0 && Math.min(...pts.map(p => p.v)) >= 0) lo = 0;
  const step = niceStep((hi - lo) / 4); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const tdec = step < 1 ? 1 : 0;
  const x = t => CL + (t - t0)/(t1 - t0)*(CW - CL - CR), y = v => CT + (hi - v)/(hi - lo)*(CH - CT - CB);
  const P = CHARTS[id] = pts.map((p,i) => ({x:x(ts[i]), y:y(p.v), date:p.date, v:p.v, unit, dec, note:p.note}));
  let grid = '';
  for (let v = lo; v <= hi + step/1e6; v += step){
    const yy = y(v).toFixed(1);
    grid += `<line x1="${CL}" x2="${CW-CR}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${CL-8}" y="${yy}" dy="4" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(v,tdec)}</text>`;
  }
  const xl = [P[0]]; if (P.length > 1) xl.push(P[P.length-1]);
  const xlab = xl.map((p,i) => `<text x="${p.x.toFixed(1)}" y="${CH-8}" text-anchor="${xl.length===1?'middle':i===0?'start':'end'}" font-size="12" fill="var(--muted)">${esc(fmtDate(p.date))}</text>`).join('');
  const line = P.map((p,i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const area = P.length > 1 ? `<path d="${line} L${P[P.length-1].x.toFixed(1)} ${CH-CB} L${P[0].x.toFixed(1)} ${CH-CB} Z" fill="var(--accent)" opacity=".08"/>` : '';
  const last = P[P.length-1];
  return `<svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(label)} ao longo do tempo">
    ${grid}${xlab}${area}
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${P.map((p,i) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===P.length-1?5:4}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('')}

function bindChart(id){

  if (!svg || !P) return;
  const tip = box.querySelector('.tip'), xh = svg.querySelector('.xh'), xp = svg.querySelector('.xp');

    let best = P[0]; for (const p of P) if (Math.abs(p.x - px) < Math.abs(best.x - px)) best = p;
    xh.setAttribute('x1', best.x); xh.setAttribute('x2', best.x); xh.setAttribute('visibility', 'visible');
    xp.setAttribute('cx', best.x); xp.setAttribute('cy', best.y); xp.setAttribute('visibility', 'visible');

  };

/* ---------- progresso do treino ---------- */
let trainLog = {}, progEx = null;
const keyOf = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parseKg = s => { const m = String(s || '').replace(',', '.').match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const repsNum = s => { const r = String(s || ''); const m = r.match(/(\d+)\s*[-a–]\s*(\d+)/); if (m) return (+m[1] + +m[2]) / 2; const n = r.match(/\d+/); return n ? +n[0] : null; };
const setsOf = l => Object.values((l && l.sets) || {}).reduce((s,n) => s + (+n || 0), 0);
function mondayOf(d){ const m = new Date(d); m.setHours(12,0,0,0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; }
function trainedDates(){ return Object.keys(trainLog).filter(k => setsOf(trainLog[k]) > 0).sort(); }
function weekCounts(n){
  const mon = mondayOf(today), out = [];
  for (let i = n - 1; i >= 0; i--){
    const s = new Date(mon); s.setDate(mon.getDate() - 7*i);
    let c = 0; for (let j = 0; j < 7; j++){ const d = new Date(s); d.setDate(s.getDate() + j); if (setsOf(trainLog[keyOf(d)]) > 0) c++; }
    out.push({start:s, count:c});
  }
  return out;
}
function streakWeeks(){
  const w = weekCounts(104); let i = w.length - 1, s = 0;
  if (w[i].count === 0) i--; // a semana atual ainda está em andamento
  for (; i >= 0 && w[i].count > 0; i--) s++;
  return s;
}
function exerciseSeries(){
  const map = {};
  for (const k of Object.keys(trainLog).sort()){
    const ex = trainLog[k].ex || {};
    for (const [id, e] of Object.entries(ex)){
      if (!(e.n > 0)) continue;
      const key = String(e.name || id).trim().toLowerCase();
      const m = map[key] = map[key] || {id:key, name:e.name, pts:[]};
      m.name = e.name || m.name;
      if (e.kg != null) m.pts.push({date:k, v:e.kg, note: e.n + ' × ' + (e.reps ?? '—')});
    }
  }
  return Object.values(map).filter(m => m.pts.length).sort((a,b) => a.name.localeCompare(b.name, 'pt-BR'));
}
function volumeSeries(){
  return Object.keys(trainLog).sort().map(k => {
    let v = 0, any = false;
    for (const e of Object.values(trainLog[k].ex || {})) if (e.n > 0 && e.kg != null && e.reps != null){ v += e.n * e.reps * e.kg; any = true; }
    return any ? {date:k, v, note: trainLog[k].label || ''} : null;
  }).filter(Boolean);
}
function barsSVG(weeks){
  const W = 400, H = 190, L = 6, R = 6, T = 24, B = 28, n = weeks.length;
  const max = Math.max(3, ...weeks.map(w => w.count));
  const slot = (W - L - R) / n, bw = Math.min(24, slot * 0.62);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Treinos por semana nas últimas ${n} semanas"><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>`;
  weeks.forEach((w,i) => {
    const cx = L + slot*i + slot/2, h = w.count ? Math.max(6, (H - T - B) * w.count / max) : 0, y = H - B - h, cur = i === n - 1;
    if (h) s += `<path d="M${(cx-bw/2).toFixed(1)} ${H-B} V${(y+4).toFixed(1)} Q${(cx-bw/2).toFixed(1)} ${y.toFixed(1)} ${(cx-bw/2+4).toFixed(1)} ${y.toFixed(1)} H${(cx+bw/2-4).toFixed(1)} Q${(cx+bw/2).toFixed(1)} ${y.toFixed(1)} ${(cx+bw/2).toFixed(1)} ${(y+4).toFixed(1)} V${H-B} Z" fill="var(--accent)" opacity="${cur ? 1 : .75}"><title>Semana de ${fmtDate(keyOf(w.start))}: ${w.count} treino${w.count===1?'':'s'}</title></path>
      <text x="${cx.toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--fg)">${w.count}</text>`;
    else s += `<circle cx="${cx.toFixed(1)}" cy="${H-B-4}" r="2.5" fill="var(--line)"><title>Semana de ${fmtDate(keyOf(w.start))}: nenhum treino</title></circle>`;
    if (i % 3 === 0 || cur) s += `<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${cur ? 'esta' : esc(fmtDate(keyOf(w.start)))}</text>`;
  });
  return s + '</svg>';
}
function heatmap(nWeeks){
  const mon = mondayOf(today), start = new Date(mon); start.setDate(mon.getDate() - 7*(nWeeks-1));
  const lvl = c => c === 0 ? 0 : c <= 5 ? 1 : c <= 10 ? 2 : c <= 15 ? 3 : 4;
  let cols = '';
  for (let w = 0; w < nWeeks; w++){
    let cells = '';
    for (let d = 0; d < 7; d++){
      const day = new Date(start); day.setDate(start.getDate() + 7*w + d);
      const k = keyOf(day), c = setsOf(trainLog[k]), fut = day > today;
      cells += `<i class="hm l${fut ? 'x' : lvl(c)}${k === logKey ? ' now' : ''}" title="${esc(fmtDate(k, true))}: ${fut ? '' : c ? c + ' séries' : 'sem treino'}"></i>`;
    }
    cols += `<div class="hm-col">${cells}</div>`;
  }
  return `<div class="hm-wrap"><div class="hm-days">${['seg','','qua','','sex','','dom'].map(t => `<span>${t}</span>`).join('')}</div><div class="hm-grid">${cols}</div></div>
    <div class="hm-legend"><span>Menos</span>${[0,1,2,3,4].map(l => `<i class="hm l${l}"></i>`).join('')}<span>Mais séries</span></div>`;
}

    const blob = new Blob([JSON.stringify(backupData(), null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'treino-backup-' + logKey + '.json';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Backup baixado');
  } catch(e){ toast('Não deu para gerar o backup.'); }
}
async function applyBackup(obj){
  if (!obj || obj.app !== 'treino-do-dia' || !(obj.plan || obj.measures || obj.profile)){ toast('Esse arquivo não é um backup do Treino do Dia.'); return; }
  plan = obj.plan || null; profile = obj.profile || null;
  measures = (obj.measures || []).filter(m => m && m.id && m.date); sortM();
  trainLog = obj.logs || {}; log = trainLog[logKey] || {sets:{}}; if (!log.sets) log.sets = {};
  local.set('plan/current', plan); local.set('profile/me', profile); local.set('measures', measures); local.set('history', trainLog);
  if (mode === 'db'){
    toast('Restaurando…');
    const writes = [];
    if (plan) writes.push(db.doc('plan/current').set(clone(plan)));
    if (profile) writes.push(db.doc('profile/me').set(clone(profile)));
    for (const m of measures){ const b = clone(m); delete b.id; writes.push(db.collection('measures').doc(m.id).set(b)); }
    for (const [k, v] of Object.entries(trainLog)) if (/^\d{4}-\d{2}-\d{2}$/.test(k)) writes.push(db.doc('logs/' + k).set(clone(v)));
    try { await Promise.race([Promise.all(writes), new Promise(r => setTimeout(r, 6000))]); }
    catch(e){ toast('Parte do backup não foi salva na conta. Tente de novo com internet.'); return; }
  }
  closeSheet(); view = 'today'; render(); toast('Backup restaurado');
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b){ if (ev.target.id === 'sheet') closeSheet(); return; }
  const a = b.dataset.act, id = b.dataset.id, di = +b.dataset.d, ei = +b.dataset.e;
  if (a === 'tab'){
    closeSheet(); view = b.dataset.v; viewDayId = null;
    try { location.hash = view === 'body' ? 'corpo' : view === 'prog' ? 'progresso' : 'treino'; } catch(e){}
    render(); window.scrollTo(0,0); return;
  }
  if (a === 'login'){ doLogin(); return; }
  if (a === 'account'){ renderAccount(); return; }
  if (a === 'export'){ downloadBackup(); return; }
  if (a === 'logout'){ if (cloudRef) cloudRef.signOut().then(() => { try { localStorage.clear(); } catch(e){} location.reload(); }); return; }
  if (a === 'newm'){ bdraft = {id:uid(), date:logKey}; view = 'bform'; render(); window.scrollTo(0,0); return; }
  if (a === 'openm'){ openEntry = id; confirmMDel = false; renderEntrySheet(); return; }
  if (a === 'editm'){ const e = measures.find(x => x.id === openEntry); if (e){ bdraft = clone(e); closeSheet(); view = 'bform'; render(); window.scrollTo(0,0); } return; }
  if (a === 'delm'){ if (confirmMDel){ deleteMeasure(openEntry); closeSheet(); render(); toast('Medição excluída'); } else { confirmMDel = true; renderEntrySheet(); } return; }
  if (a === 'savem'){ commitBForm(); return; }
  if (a === 'cancelm'){ bdraft = null; view = 'body'; render(); window.scrollTo(0,0); return; }
  if (a === 'metric'){ metric = b.dataset.k; render(); return; }
  if (a === 'profile'){ pdraft = clone(profile || {}); view = 'profile'; render(); window.scrollTo(0,0); return; }
  if (a === 'savepf'){ commitProfile(); return; }
  if (a === 'cancelpf'){ pdraft = null; view = 'body'; render(); return; }
  if (a === 'day'){ viewDayId = viewDayId === id ? null : id; render(); }
  else if (a === 'vw'){ viewDayId = null; viewWd = +b.dataset.w; render(); }
  else if (a === 'sched'){ openEditor(); const s = $('#sched'); if (s) s.scrollIntoView({block:'start'}); }
  else if (a === 'preset'){
    const days = {'seg-sex':[1,2,3,4,5], 'seg-sab':[1,2,3,4,5,6], 'todos':[1,2,3,4,5,6,0]}[b.dataset.p];
    if (!draft.days.length) return;
    WEEK_ORDER.forEach(w => assign(w, null));
    days.forEach((w,i) => assign(w, draft.days[i % draft.days.length].id));
    renderSched();
  }
  else if (a === 'toggle'){ const ex = findEx(id); log.sets[id] = isDone(ex) ? 0 : ex.sets; saveLog(); render(); }
  else if (a === 'open'){ vidEdit = false; openId = id; renderSheet(); }
  else if (a === 'close') closeSheet();
  else if (a === 'set'){
    const ex = findEx(openId), n = +b.dataset.n;
    const was = setsDone(ex);
    log.sets[ex.id] = was >= n ? n - 1 : n;
    saveLog();
    if (log.sets[ex.id] > was && log.sets[ex.id] < ex.sets && ex.rest) startTimer(ex);
    render(); renderSheet();
  }
  else if (a === 'editvid'){
    const ex = findEx(openId); if (!ex) return;
    vdraft = clone(vids(ex)); if (!vdraft.length) vdraft.push({label:'', url:''});
    vidEdit = true; renderSheet();
    const i = $('#' + (vdraft[0].url ? 'vl-0' : 'vu-0')); if (i) i.focus();
  }
  else if (a === 'addvid'){ vdraft.push({label:'', url:''}); renderSheet(); const i = $('#vl-' + (vdraft.length-1)); if (i) i.focus(); }
  else if (a === 'rmvidrow'){ vdraft.splice(+b.dataset.i, 1); renderSheet(); }
  else if (a === 'cancelvid'){ vidEdit = false; vdraft = null; renderSheet(); }
  else if (a === 'savevid'){
    const ex = findEx(openId); if (!ex) return;
    const out = [];
    for (const [i, v] of vdraft.entries()){
      const raw = (v.url || '').trim(); if (!raw) continue;
      const u = cleanVideo(raw);
      if (!u){ toast('O link da versão ' + (i+1) + ' não parece um link de vídeo. Cole o link copiado do YouTube.'); return; }
      const old = (ex.videos || []).find(o => o.url === u);
      out.push(Object.assign({label:(v.label || '').trim(), url:u}, old && old.dur ? {dur:old.dur} : {}));
    }
    ex.videos = out; ex.video = out[0] ? out[0].url : '';
    vidEdit = false; vdraft = null; savePlan(); renderSheet();
    toast(out.length ? out.length + (out.length === 1 ? ' vídeo salvo' : ' vídeos salvos') : 'Vídeos removidos. O botão volta a abrir a busca');
  }
  else if (a === 'timer'){ const ex = findEx(openId); if (timer.iv) stopTimer(); else startTimer(ex); renderSheet(); }
  else if (a === 'edit') openEditor();
  else if (a === 'new') openEditor({name:'Meu plano', days:[blankDay(0)]});
  else if (a === 'example'){ plan = clone(EXAMPLE); savePlan(); render(); }
  else if (a === 'cancel'){ draft = null; view = 'today'; render(); }
  else if (a === 'saveplan') commitEditor();
  else if (a === 'wd'){ const d = draft.days[di], w = +b.dataset.w; d.weekdays = d.weekdays || []; d.weekdays = d.weekdays.includes(w) ? d.weekdays.filter(x=>x!==w) : d.weekdays.concat(w); b.setAttribute('aria-pressed', d.weekdays.includes(w)); }
  else if (a === 'addex'){ draft.days[di].exercises.push(blankEx()); confirmDel = null; renderEditor(); }
  else if (a === 'rmex'){ draft.days[di].exercises.splice(ei,1); renderEditor(); }
  else if (a === 'mv'){ const l = draft.days[di].exercises, j = ei + +b.dataset.dir; [l[ei], l[j]] = [l[j], l[ei]]; renderEditor(); }
  else if (a === 'addday'){ draft.days.push(blankDay(draft.days.length)); confirmDel = null; renderEditor(); }
  else if (a === 'rmday'){ if (confirmDel === di){ draft.days.splice(di,1); confirmDel = null; } else confirmDel = di; renderEditor(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'sh-load'){ const ex = findEx(openId); if (ex){ ex.load = t.value; savePlan(); if ((log.sets[ex.id] || 0) > 0) saveLog(); } return; }
  if (bdraft && t.dataset.m){ bdraft[t.dataset.m] = t.value; return; }
  if (vdraft && t.dataset.vl != null){ vdraft[+t.dataset.vl].label = t.value; return; }
  if (vdraft && t.dataset.vu != null){ vdraft[+t.dataset.vu].url = t.value; return; }
  if (pdraft && t.dataset.pf){ pdraft[t.dataset.pf] = t.value; return; }
  if (!draft || t.dataset.f == null) return;
  const d = draft.days[+t.dataset.d];
  const target = t.dataset.e != null ? d.exercises[+t.dataset.e] : d;
  target[t.dataset.f] = t.value;
  if (t.dataset.e == null) renderSched();
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'imp-file'){
    const f = t.files && t.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { let o = null; try { o = JSON.parse(r.result); } catch(e){} applyBackup(o); };
    r.readAsText(f); return;
  }
  if (t.id === 'sh-load') render();
  else if (t.dataset.progex){ progEx = t.value; render(); }
  else if (draft && t.dataset.wk != null){ assign(+t.dataset.wk, t.value); renderSched(); }
  else if (pdraft && t.dataset.pf) pdraft[t.dataset.pf] = t.value;
  else if (bdraft && t.dataset.m) bdraft[t.dataset.m] = t.value;
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && (openId || openEntry)) closeSheet(); });

init();
</script>
